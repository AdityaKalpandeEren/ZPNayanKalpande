<style>
:root{
  --paper:#fbfbf6; --ink:#1f2d6b; --muted:#5a6280; --card:#ffffff; --line:#dde2ec; --soft:#eef2fa;
  --blue:#86aee0; --red:#e4726a; --leaf:#2d8656; --sun:#f0b429; --ok:#1d8a4b; --bad:#c3342a;

  --paper:#121826; --ink:#e7ebf7; --muted:#9ea7c0; --card:#1a2233; --line:#2e3a52; --soft:#212c41;
  --blue:#4f76a8; --red:#c25a52; --leaf:#4cc27d; --sun:#f3c04f; --ok:#4cc27d; --bad:#ff7a6e;}}
:root[data-theme="dark"]{
  --paper:#121826; --ink:#e7ebf7; --muted:#9ea7c0; --card:#1a2233; --line:#2e3a52; --soft:#212c41;
  --blue:#4f76a8; --red:#c25a52; --leaf:#4cc27d; --sun:#f3c04f; --ok:#4cc27d; --bad:#ff7a6e;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Andika","Mukta","Noto Sans Devanagari",sans-serif;font-size:17px;line-height:1.6}
.mr{font-family:"Mukta","Noto Sans Devanagari","Mangal",sans-serif}
h1,h2,h3,.bar-title{font-family:"Baloo 2","Andika",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hidden{display:none!important}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* four-line ruling */
.ruled{background-image:linear-gradient(transparent calc(20% - 1px),var(--blue) calc(20% - 1px),var(--blue) 20%,transparent 20%,
  transparent calc(45% - 1px),var(--red) calc(45% - 1px),var(--red) 45%,transparent 45%,
  transparent calc(70% - 1px),var(--red) calc(70% - 1px),var(--red) 70%,transparent 70%,
  transparent calc(95% - 1px),var(--blue) calc(95% - 1px),var(--blue) 95%,transparent 95%)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px double var(--red)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar-title{flex:1;font-weight:800;font-size:19px;line-height:1.2}
.bar-title small{display:block;font-family:"Mukta",sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:18px;cursor:pointer}
.hero{padding:26px 0 6px}
.hero .ruled{padding:6px 4px 2px}
.hero h1{font-family:"Andika",sans-serif;font-size:42px;line-height:1.12;margin:0;font-weight:700;letter-spacing:.2px}
.hero p{margin:12px 0 0;color:var(--muted)}
.std-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 10px}
.std-tile{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px 14px;cursor:pointer;color:var(--ink);text-align:center}
.std-tile .ruled{height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.std-tile .n{font-family:"Andika",sans-serif;font-size:74px;font-weight:700;line-height:1;transform:translateY(-4px)}
.std-tile .n sup{font-size:26px}
.std-tile b{font-size:17px}.std-tile .mr{display:block;font-size:15px;color:var(--muted)}
.std-tile.chosen{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 30%,transparent)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--red);padding:4px 10px;margin:18px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;color:var(--ink);min-height:96px}
.tile .ic{font-size:28px;line-height:1}
.tile b{display:block;font-family:"Baloo 2",sans-serif;font-size:18px;margin-top:6px;line-height:1.2}
.tile span{display:block;font-size:13.5px;color:var(--muted);line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.card h2{margin:0 0 6px;font-size:23px}.card h3{margin:14px 0 4px;font-size:19px;color:var(--red)}
.card p{margin:6px 0}
.qa{background:var(--soft);border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:8px 0}
.rule{border:2px dashed var(--sun);border-radius:12px;padding:10px 12px;margin:10px 0}
.eg{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}
ul,ol{padding-left:22px;margin:6px 0}li{margin:4px 0}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:17px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.listen{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--ink);text-align:left;font-size:17px}
.chip small{display:block;font-family:"Mukta",sans-serif;font-size:13.5px;color:var(--muted);line-height:1.25}
.chip:active{background:var(--soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;margin:8px 0}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}th{background:var(--soft)}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;background:var(--paper);color:var(--ink);font-family:"Andika","Mukta",sans-serif}
textarea{min-height:90px;resize:vertical}
.out:empty{display:none}.out{margin-top:10px}
.ok{color:var(--ok);font-weight:700}.err{color:var(--bad);font-weight:700}
/* jumble */
.slot{min-height:56px;border:2px dashed var(--blue);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.word{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer}
.slot .word{background:var(--leaf);color:#fff}
/* flash */
.flash{border:2px solid var(--line);border-radius:18px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--card);padding:16px;text-align:center}
.flash .en{font-size:38px;font-weight:700}.flash .m{font-size:24px;color:var(--leaf)}
/* quiz */
.q{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--card)}
.q p{margin:0 0 8px;font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16.5px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{font-size:15px;margin-top:6px;color:var(--muted)}
.scorebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;z-index:3}
.scorebar button{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.timer{font-size:44px;font-weight:700;text-align:center;font-family:"Andika",sans-serif}
.dict td{white-space:normal}
.acct{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:14px}.acct span{flex:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:22px 16px 30px}
</style>

let voices=[]; function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
let rate=0.85;
function speak(text){
  if(!('speechSynthesis' in window)){ alert('Audio is not supported in this browser. / या ब्राउझरमध्ये आवाज उपलब्ध नाही.'); return; }
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
  const v=voices.find(v=>v.lang==='en-IN')||voices.find(v=>/^en[-_]GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(v) u.voice=v; u.lang=v?v.lang:'en-IN'; u.rate=rate; speechSynthesis.speak(u);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

sentence:{ic:"✍️",t:"Sentence Making",m:"वाक्य तयार करणे",render(){
  return `<div class="card"><h2>✍️ Sentence Making</h2>
  <div class="rule mr"><b>वाक्याची रचना :</b> Subject (कर्ता) + Verb (क्रियापद) + Object (कर्म)<br><span style="font-family:Andika,sans-serif">Ravi + reads + a book.</span><br>इंग्रजीत क्रियापद कर्त्यानंतर लगेच येते; मराठीत ते शेवटी येते (रवी पुस्तक <b>वाचतो</b>).</div>
  <h3>1. Arrange the words</h3><p class="mr">शब्द योग्य क्रमाने टॅप करून वाक्य बनवा.</p>
  <div class="slot" id="jAns"></div><div class="chips" id="jPool" style="margin-top:10px"></div>
  <div class="btnrow"><button class="btn" id="jChk">Check ✓</button><button class="btn alt" id="jShow">Show answer</button><button class="btn alt" id="jNext">Next →</button></div>
  <div class="out" id="jOut"></div><p class="mr" id="jCount" style="color:var(--muted);font-size:14px"></p></div>
  <div class="card"><h3 style="margin-top:0">2. Complete the sentence</h3><p class="mr">रिकाम्या जागी स्वतःचे शब्द वापरून वाक्य लिहा.</p>
  ${FRAMES[std].map(f=>`<div class="eg">${esc(f)}</div>`).join('')}
  <h3>3. Write your sentence and check</h3>
  <textarea id="myS" placeholder="Example: I like mangoes because they are sweet."></textarea>
  <div class="btnrow"><button class="btn" id="sChk">Check my sentence</button><button class="btn alt" id="sSpk">🔊 Listen</button></div><div class="out" id="sOut"></div></div>`;},
  init(){
    let idx=0,pool=[],ans=[];const list=JUMBLE[std];
    const load=()=>{const s=list[idx];const words=s.replace(/[.?!]$/,'').split(' ');
      const keepCap=w=>w==='I'||/^(Rahul|Ravi|Amit|Meena)$/.test(w);
      const tiles=words.map((w,i)=>i===0&&!keepCap(w)?w.toLowerCase():w);
      do{pool=shuffle(tiles.map((w,i)=>({w,i})));}while(pool.length>1&&pool.every((p,k)=>p.i===k));
      ans=[];draw();document.getElementById('jOut').innerHTML='';document.getElementById('jCount').textContent=`वाक्य ${idx+1} / ${list.length}`;};
    const draw=()=>{const P=document.getElementById('jPool'),A=document.getElementById('jAns');
      P.innerHTML=pool.map((p,k)=>`<button class="word" data-k="${k}">${esc(p.w)}</button>`).join('');
      A.innerHTML=ans.length?ans.map((p,k)=>`<button class="word" data-a="${k}">${esc(p.w)}</button>`).join(''):'<span class="mr" style="color:var(--muted)">येथे वाक्य तयार होईल…</span>';
      P.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ans.push(pool.splice(+b.dataset.k,1)[0]);draw();});
      A.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{pool.push(ans.splice(+b.dataset.a,1)[0]);draw();});};
    const target=()=>list[idx].replace(/[.?!]$/,'').toLowerCase();
    document.getElementById('jChk').onclick=()=>{const o=document.getElementById('jOut');
      if(pool.length) {o.innerHTML='<p class="err mr">सर्व शब्द वापरा.</p>';return;}
      const mine=ans.map(p=>p.w).join(' ').toLowerCase();
      o.innerHTML= mine===target()?`<p class="ok">✅ Correct! ${esc(list[idx])}</p>`:'<p class="err mr">❌ अजून एकदा प्रयत्न करा. शब्दावर टॅप करून तो परत काढता येतो.</p>';
      if(mine===target()) speak(list[idx]);};
    document.getElementById('jShow').onclick=()=>{document.getElementById('jOut').innerHTML=`<p><b>Answer:</b> ${esc(list[idx])}</p>`;speak(list[idx]);};
    document.getElementById('jNext').onclick=()=>{idx=(idx+1)%list.length;load();};
    load();
    document.getElementById('sSpk').onclick=()=>{const t=document.getElementById('myS').value.trim(); if(t) speak(t);};
    document.getElementById('sChk').onclick=()=>{const t=document.getElementById('myS').value.trim(),o=document.getElementById('sOut');
      if(!t){o.innerHTML='<p class="err mr">आधी एक वाक्य लिहा.</p>';return;}
      const tips=[],words=t.split(/\s+/);
      if(!/^[A-Z]/.test(t)) tips.push('वाक्याची सुरुवात कॅपिटल अक्षराने करा.');
      if(!/[.?!]$/.test(t)) tips.push('वाक्याच्या शेवटी पूर्णविराम ( . ), प्रश्नचिन्ह ( ? ) किंवा उद्गारचिन्ह ( ! ) लिहा.');
      if(/(^|\s)i(\s|[.,?!']|$)/.test(t)) tips.push('“I” (मी) हा शब्द नेहमी कॅपिटल लिहा.');
      if(words.length<3) tips.push('वाक्य थोडे मोठे लिहा (किमान 3 शब्द).');
      if(/\s{2,}/.test(document.getElementById('myS').value.trim())) tips.push('दोन शब्दांमध्ये एकच जागा ठेवा.');
      o.innerHTML= tips.length?'<div class="mr"><p class="err">हे सुधारा :</p><ul>'+tips.map(x=>`<li>${x}</li>`).join('')+'</ul></div>'
        :'<p class="ok mr">✅ कॅपिटल अक्षर, विरामचिन्ह व रचना ठीक दिसते. आता शिक्षकांना वाक्याचा अर्थ व व्याकरण तपासायला सांगा.</p>';};
  }},

      if(PHRASES[norm]){o.innerHTML=`<div class="eg"><b>${esc(raw)}</b><br><span class="mr" style="font-size:22px">${PHRASES[norm]}</span></div>`;return;}
      const toks=norm.split(' ').map(w=>w.replace(/^[^a-z']+|[^a-z']+$/g,'')).filter(Boolean);
      const rows=toks.map(w=>{const r=lookup(w);return `<tr><td>${esc(w)}</td><td class="mr">${r?esc(r.m)+(r.base?` <small style="color:var(--muted)">(मूळ शब्द: ${esc(r.base)}${r.pl?' – अनेकवचन':''})</small>`:''):'<span style="color:var(--muted)">शब्दकोशात नाही</span>'}</td></tr>`;}).join('');
      o.innerHTML=(toks.length>1?'<p class="mr" style="font-size:14.5px;color:var(--muted)">प्रत्येक शब्दाचा अर्थ (शब्दशः). मराठी वाक्यात शब्दांचा क्रम वेगळा असतो.</p>':'')+`<div class="scroll"><table class="dict"><tr><th>English</th><th>मराठी</th></tr>${rows}</table></div>`;};
    // AI sentence translation (optional)
    (async()=>{try{ if(!window.claude||!window.claude.use) return; const sample=await window.claude.use('sample'); if(!sample) return;
      g('aiBox').classList.remove('hidden');
      g('aiGo').onclick=async()=>{const t=g('cIn').value.trim(),o=g('aiOut'); if(!t){o.innerHTML='<p class="err">आधी इंग्रजी मजकूर लिहा.</p>';return;}
        o.innerHTML='<p>भाषांतर होत आहे…</p>'; g('aiGo').disabled=true;
        try{ const r=await sample(`Translate the following English text into simple, correct Marathi (Devanagari script) suitable for a Class 6–7 student in Maharashtra. Reply with only the Marathi translation and nothing else.\n\nEnglish: ${t}`,{modelTier:'quick',onText:({text})=>{o.innerHTML=`<div class="eg" style="font-size:20px">${esc(text)}</div>`;}});
          o.innerHTML=`<div class="eg" style="font-size:20px">${esc(r.text.trim())}</div><p style="font-size:13.5px;color:var(--muted)">AI भाषांतर – शिक्षकांकडून तपासून घ्या.</p>`;
        }catch(e){ o.innerHTML= e&&e.code==='not_granted'?'<p class="err">AI भाषांतरासाठी परवानगी मिळाली नाही. वरील शब्दकोश वापरा.</p>':'<p class="err">AI भाषांतर आत्ता उपलब्ध नाही. थोड्या वेळाने पुन्हा प्रयत्न करा.</p>'; }
        g('aiGo').disabled=false; };
    }catch(e){}})();
  }},

test:{ic:"📝",t:"Test",m:"सराव चाचणी",render(){const Q=QUIZ[std];
  return `<div class="scorebar"><span id="qs">Score: 0 / ${Q.length}</span><button id="qr">Try again</button></div>`+
  Q.map((q,i)=>`<div class="q" data-i="${i}"><p>${i+1}. ${esc(q.q)}</p>${q.o.map((t,j)=>`<button class="opt" data-j="${j}">${esc(t)}</button>`).join('')}<div class="why hidden"></div></div>`).join('');},
  init(){let sc=0,done=0;const Q=QUIZ[std];
    app.querySelectorAll('.q').forEach(el=>{const q=Q[+el.dataset.i];el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('.opt').forEach(x=>x.disabled=true);const j=+b.dataset.j;
      if(j===q.a){b.classList.add('right');sc++;}else{b.classList.add('wrong');el.querySelectorAll('.opt')[q.a].classList.add('right');}
      done++;const w=el.querySelector('.why');w.textContent=(j===q.a?'✅ Correct. ':'❌ Not quite. ')+q.e;w.classList.remove('hidden');
      document.getElementById('qs').textContent=`Score: ${sc} / ${Q.length}`+(done===Q.length?' 🎉':'');});});
    document.getElementById('qr').onclick=()=>openSection('test');}}
};

function lookup(w){
  if(DICT[w]) return {m:DICT[w]};
  const PL=['children','men','women','teeth','feet','mice','leaves'];
  if(IRREG[w]&&DICT[IRREG[w]]) return {m:DICT[IRREG[w]],base:IRREG[w],pl:PL.includes(w)};
  const tries=[];
  if(w.endsWith("'s")) tries.push(w.slice(0,-2));
  if(w.endsWith('ies')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) tries.push(w.slice(0,-2));
  if(w.endsWith('s')) tries.push(w.slice(0,-1));
  if(w.endsWith('ing')){const b=w.slice(0,-3);tries.push(b,b+'e');if(/(.)\1$/.test(b))tries.push(b.slice(0,-1));}
  if(w.endsWith('ied')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('ed')){const b=w.slice(0,-2);tries.push(b,w.slice(0,-1));if(/(.)\1$/.test(b))tries.push(b.slice(0,-1));}
  if(w.endsWith('er')) tries.push(w.slice(0,-2));
  for(const t of tries) if(t.length>1&&DICT[t]) return {m:DICT[t],base:t};
  return null;
}
function timer(dispId,goId,reId,secs){
  let total=secs,left=secs,h=null;const d=document.getElementById(dispId);
  const show=()=>{d.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;};
  const stop=()=>{clearInterval(h);h=null;document.getElementById(goId).textContent='Start';};
  document.getElementById(goId).onclick=()=>{ if(h){stop();return;} if(left<=0) left=total;
    document.getElementById(goId).textContent='Pause'; h=setInterval(()=>{left--;show();if(left<=0){stop();d.textContent='⏰ Time up!';}},1000);};
  document.getElementById(reId).onclick=()=>{stop();left=total;show();};
  show(); return {set(n){stop();total=n;left=n;show();}};
}

  ${window.NK&&NK.profile?`<div class="acct mr"><span>Hello, <b>${esc(String(NK.profile.name).split(' ')[0])}</b> 👋</span><button class="iconbtn" id="hTop">🏆 Top 10</button><button class="iconbtn" id="hAcc" aria-label="My account">👤</button></div>`:''}

   <button class="std-tile ${std===7?'chosen':''}" data-s="7"><div class="ruled"><span class="n">7<sup>th</sup></span></div><b>Standard 7</b><span class="mr">इयत्ता सातवी</span></button>
  </div>
  <p class="note mr">महाराष्ट्र राज्य मंडळाच्या इयत्ता ६ वी व ७ वी इंग्रजी अभ्यासातील भाषिक कौशल्यांवर (वाचन, शब्दसंग्रह, व्याकरण, बोलणे, लेखन) आधारित सराव. पाठ्यपुस्तकासोबत वापरा.</p>`;
  app.querySelectorAll('.std-tile').forEach(b=>b.onclick=()=>{std=+b.dataset.s;try{localStorage.setItem('nke-std',std)}catch(e){}go({screen:'menu'});});
  const ht=document.getElementById('hTop'),ha=document.getElementById('hAcc'); if(ht) ht.onclick=()=>NK.showTop10(); if(ha) ha.onclick=()=>NK.showProfile();
}
function renderMenu(){
  bar.classList.remove('hidden'); barTitle.innerHTML=`${std===6?'Standard 6':'Standard 7'}<small>Nayan Kalpande English</small>`;
  app.innerHTML=`<div class="menu">`+Object.entries(SECTIONS).filter(([k,s])=>!s.only||s.only===std).map(([k,s])=>
   `<button class="tile" data-k="${k}"><span class="ic">${s.ic}</span><b>${s.t}</b><span class="mr">${s.m}</span></button>`).join('')+
   (window.NK?`<button class="tile" id="mTop"><span class="ic">🏆</span><b>Top 10</b><span class="mr">टॉप १० वापरकर्ते</span></button><button class="tile" id="mAcc"><span class="ic">👤</span><b>My Account</b><span class="mr">माझे खाते</span></button>`:'')+`</div>`;
  const mt=document.getElementById('mTop'),ma=document.getElementById('mAcc'); if(mt) mt.onclick=()=>NK.showTop10(); if(ma) ma.onclick=()=>NK.showProfile();
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>go({screen:'sec',sec:b.dataset.k}));
}
function openSection(k){
  const s=SECTIONS[k]; bar.classList.remove('hidden'); barTitle.innerHTML=`${s.t}<small>${stdName()}</small>`;
  try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=s.render(); s.init&&s.init(); window.scrollTo(0,0);
}
function render(){ if(!std&&current.screen!=='home') current={screen:'home'};
  if(current.screen==='home') renderHome(); else if(current.screen==='menu') renderMenu(); else openSection(current.sec); }
function go(st){ current=st; try{history.pushState(st,'')}catch(e){} render(); window.scrollTo(0,0); }
window.addEventListener('popstate',e=>{current=e.state||{screen:'home'};render();});
document.getElementById('backBtn').onclick=()=>{ if(history.state&&history.state.screen!=='home') history.back(); else go({screen:'home'}); };
try{history.replaceState({screen:'home'},'')}catch(e){}
render();
if(window.NK) NK.onReady(p=>{ if(!std&&p&&(p.cls==='6'||p.cls==='7')){ std=+p.cls; try{localStorage.setItem('nke-std',std)}catch(e){} } render(); });
