<style>
:root{
  --paper:#f6f8f3; --grid:rgba(38,86,160,.08); --ink:#1b2d5a; --muted:#56607a;
  --card:#ffffff; --line:#dbe2ec; --slate:#22463b; --chalk:#f4f1e6;
  --marigold:#e89b12; --margin:#cf4638; --ok:#1d8a4b; --bad:#c3342a; --soft:#eef3fb; --sel:#fff4dc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111922; --grid:rgba(140,180,255,.05); --ink:#e6ecf7; --muted:#9ba7bd;
  --card:#19232f; --line:#2c3b4f; --slate:#1e3d33; --chalk:#f1eee2;
  --marigold:#f3b23c; --margin:#ff7b6b; --ok:#4cc27d; --bad:#ff7a6e; --soft:#1f2c3b; --sel:#2d2616;}}
:root[data-theme="dark"]{
  --paper:#111922; --grid:rgba(140,180,255,.05); --ink:#e6ecf7; --muted:#9ba7bd;
  --card:#19232f; --line:#2c3b4f; --slate:#1e3d33; --chalk:#f1eee2;
  --marigold:#f3b23c; --margin:#ff7b6b; --ok:#4cc27d; --bad:#ff7a6e; --soft:#1f2c3b; --sel:#2d2616;}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Mangal",sans-serif;font-size:17px;line-height:1.6;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3,.bar-title,.num{font-family:"Baloo 2","Mukta","Noto Sans Devanagari",sans-serif}
button{font-family:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 28px}
.hidden{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--margin)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar-title{font-weight:800;font-size:18px;flex:1;line-height:1.15;min-width:0}
.bar-title small{display:block;font-family:"Mukta",sans-serif;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;height:44px;font-size:17px;cursor:pointer;padding:0 10px;flex:0 0 auto}
.iconbtn:active{transform:scale(.96)}
/* page enter */
.page{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
/* home */
.hero{padding:22px 2px 6px}
.hero h1{font-size:38px;line-height:1.05;margin:0;letter-spacing:-.4px}
.hero h1 span{display:block;font-size:21px;color:var(--margin);margin-top:6px;font-weight:700}
.hero p{color:var(--muted);margin:10px 0 0}
.hello{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:14px}
.hello span{flex:1}
.std-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 6px}
.std-tile{background:var(--slate);color:var(--chalk);border:0;border-radius:18px;padding:16px 10px 14px;cursor:pointer;text-align:center;
  box-shadow:inset 0 0 0 6px #7a5a3a,0 6px 0 #5e4329;transition:transform .12s}
.std-tile:active{transform:translateY(3px)}
.std-tile .num{font-size:78px;line-height:1;font-weight:800;display:block}
.std-tile b{font-size:18px;display:block}
.std-tile small{display:block;opacity:.85;font-size:13.5px;margin-top:2px}
.std-tile.chosen{outline:4px solid var(--marigold);outline-offset:3px}
.pbar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--chalk) 25%,transparent);overflow:hidden;margin:8px 10px 0}
.pbar i{display:block;height:100%;background:var(--marigold);border-radius:8px}
.cont{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sel);border:1.5px solid var(--marigold);border-radius:16px;padding:12px 14px;margin:14px 0 0;cursor:pointer}
.cont b{display:block;font-family:"Baloo 2",sans-serif;font-size:17px}
.cont span{color:var(--muted);font-size:14px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--margin);padding:4px 10px;margin:18px 0 6px}
/* list */
.head2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 2px}
.head2 h2{margin:0;font-size:23px}
.prog{font-size:14px;color:var(--muted)}
.lpbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.lpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--marigold));border-radius:10px;transition:width .4s}
.search{position:relative;margin:8px 0 6px}
.search input{padding-left:40px}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}
.chap{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:9px 0;cursor:pointer;transition:border-color .15s,transform .1s}
.chap:active{transform:scale(.99)}
.chap .no{flex:0 0 50px;height:50px;border-radius:14px;background:var(--slate);color:var(--chalk);display:grid;place-items:center;font-size:22px;font-weight:800;font-family:"Baloo 2",sans-serif;position:relative}
.chap.done .no{background:var(--ok)}
.chap.done .no::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:var(--marigold);color:#1b1b1b;font-size:12px;display:grid;place-items:center;font-family:sans-serif}
.chap .tx{flex:1;min-width:0}
.chap b{display:block;font-family:"Baloo 2",sans-serif;font-size:18px;line-height:1.25}
.chap .tx span{font-size:13.5px;color:var(--muted);display:block;line-height:1.35}
.stars{font-size:14px;letter-spacing:1px;color:var(--marigold);white-space:nowrap}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.xbtn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.xbtn b{display:block;font-family:"Baloo 2",sans-serif;font-size:16.5px}
.xbtn span{font-size:13px;color:var(--muted)}
.xbtn.wide{grid-column:1/-1;background:var(--slate);color:var(--chalk);border:0}
.xbtn.wide span{color:var(--chalk);opacity:.85}
/* chapter */
.chhead{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.chhead .no{flex:0 0 56px;height:56px;border-radius:16px;background:var(--slate);color:var(--chalk);display:grid;place-items:center;font-size:26px;font-weight:800;font-family:"Baloo 2",sans-serif}
.chhead h2{margin:0;font-size:24px;line-height:1.15}
.chhead small{color:var(--muted);font-size:13.5px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;background:linear-gradient(var(--paper) 80%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin:12px 0}
.card h2{margin:0 0 6px;font-size:22px}
.card h3{margin:16px 0 4px;font-size:18.5px;color:var(--margin)}
.card p{margin:6px 0}
.key{background:var(--sel);border:1.5px solid var(--marigold);border-radius:16px;padding:12px 14px 12px 16px;margin:12px 0}
.key h3{margin:0 0 4px;color:var(--ink);font-size:18px}
.key ul{margin:4px 0 0;padding-left:20px}
.def{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.rule{border:2px dashed var(--marigold);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:500}
.eg{background:var(--soft);border-left:4px solid var(--ink);padding:8px 12px;border-radius:8px;margin:8px 0}
.sol{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--paper)}
.sol .qq{font-weight:700;margin-bottom:6px}
.sol .step{padding-left:12px;border-left:3px solid var(--line);margin:3px 0}
.sol .fin{font-weight:700;color:var(--ok);margin-top:6px}
.hist{border-left:4px solid var(--margin);background:color-mix(in srgb,var(--margin) 8%,transparent);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:15.5px}
ul,ol{padding-left:22px;margin:6px 0}li{margin:4px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;margin:8px 0;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--soft);font-weight:700}
td.dv{background:var(--slate);color:var(--chalk);font-weight:700}
td.wrap{white-space:normal;text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
label{font-size:14px;color:var(--muted);display:block}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;background:var(--paper);color:var(--ink);font-family:inherit}
input:focus,select:focus{border-color:var(--marigold)}
.go{background:var(--margin);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.go:active{transform:scale(.99)}
.out{margin-top:12px}.out:empty{display:none}
.ans{font-size:22px;font-weight:700;color:var(--ok)}
.err{color:var(--bad);font-weight:600}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin:8px 0}
.shape{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--paper)}
.shape svg{width:100%;height:auto;max-width:150px}
.shape b{display:block;font-family:"Baloo 2",sans-serif;font-size:16.5px}
.shape span{font-size:13.5px;color:var(--muted);line-height:1.35;display:block}
svg .s{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg .a{fill:none;stroke:var(--margin);stroke-width:2.5}
svg .f{fill:var(--soft);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
svg text{fill:var(--ink);font-family:"Mukta",sans-serif;font-size:14px}
input[type=range]{padding:0;accent-color:var(--margin);height:32px}
.tag{display:inline-block;background:var(--marigold);color:#1b1b1b;border-radius:8px;padding:2px 10px;font-weight:700}
.navrow{display:flex;gap:8px;margin:18px 0 4px}
.navrow button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-size:15.5px;font-weight:700;cursor:pointer}
.navrow .donebtn{background:var(--ok);color:#fff;border-color:var(--ok)}
.navrow .donebtn.is{background:var(--card);color:var(--ok)}
.navrow button:disabled{opacity:.4}
/* quiz */
.qz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.qdots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.qdots i{width:22px;height:6px;border-radius:4px;background:var(--line)}
.qdots i.r{background:var(--ok)}.qdots i.w{background:var(--bad)}.qdots i.c{background:var(--marigold)}
.qtext{font-size:18.5px;font-weight:700;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{font-size:15.5px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.result{text-align:center;padding:10px 0}
.result .big{font-size:48px;line-height:1.1}
.result b{font-family:"Baloo 2",sans-serif;font-size:26px;display:block}
/* games */
.hanoi{display:flex;gap:8px;justify-content:space-between;margin:10px 0;user-select:none}
.peg{flex:1;min-height:170px;border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column-reverse;align-items:center;padding:8px 4px;cursor:pointer;background:var(--paper);position:relative}
.peg::before{content:"";position:absolute;bottom:8px;top:14px;width:6px;border-radius:3px;background:var(--line);left:calc(50% - 3px)}
.peg.sel{border-color:var(--marigold);background:var(--sel)}
.disk{height:18px;border-radius:9px;margin-top:3px;position:relative;z-index:1;border:1px solid rgba(0,0,0,.15)}
.cards5{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--paper);font-size:14.5px}
.mcard .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;text-align:center;margin:6px 0}
.mcard .yn{display:flex;gap:6px}
.mcard .yn button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px;cursor:pointer;font-weight:700}
.mcard .yn button.on{background:var(--ink);color:var(--paper)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 30px}
footer a{color:inherit}
</style>

<script>
/* ================= helpers ================= */
const MRD='०१२३४५६७८९';
let std=null, useMr=true;
try{ useMr=localStorage.getItem('nkm-digits')!=='en'; const s=localStorage.getItem('nkm-std'); if(s==='6'||s==='7') std=+s; }catch(e){}
const app=document.getElementById('app');
function convertDigits(root){ if(!useMr) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ if(/[0-9]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/[0-9]/g,d=>MRD[d]); } }
function out(el,html){ if(!el) return; el.innerHTML=html; convertDigits(el); }
function num(v){ const s=String(v).trim().replace(/[०-९]/g,c=>MRD.indexOf(c)).replace(/[−–]/g,'-').replace(/,/g,''); if(s==='') return NaN; return Number(s); }
function fmt(n){ const r=Math.round(n*100)/100; return (Object.is(r,-0)?0:r).toString(); }
function fmt4(n){ const r=Math.round(n*10000)/10000; return (Object.is(r,-0)?0:r).toString(); }
const neg=n=>n<0?'−'+fmt(-n):fmt(n);
const par=n=>n<0?'('+neg(n)+')':fmt(n);
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pf(n){const f=[];let d=2;while(n>1&&d*d<=n){while(n%d===0){f.push(d);n/=d}d++}if(n>1)f.push(n);return f}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return a/gcd(a,b)*b}
function counts(arr){const m={};arr.forEach(x=>m[x]=(m[x]||0)+1);return m}
function spf(n){if(n%2===0)return 2;for(let d=3;d*d<=n;d+=2)if(n%d===0)return d;return n}
function isPrime(n){if(n<2)return false;if(n<4)return true;if(n%2===0)return false;for(let d=3;d*d<=n;d+=2)if(n%d===0)return false;return true}
function simp(n,d){const g=gcd(n,d)||1;let a=n/g,b=d/g;if(b<0){a=-a;b=-b}return [a,b];}
function fracStr(n,d){ if(d===1) return neg(n); const s=n<0?'−':'',a=Math.abs(n); const w=Math.floor(a/d),r=a%d; return w&&r? `${s}${a}/${d} = ${s}${w} ${r}/${d}` : `${s}${a}/${d}`; }
function sub(n){return String(n).replace(/-/g,'−')}
const $=(id)=>document.getElementById(id);
const stdWord=()=>std===6?'इयत्ता ६ वी':'इयत्ता ७ वी';

/* ================= drawings ================= */
function angleSVG(deg){
  const cx=110,cy=110,r=88,rad=deg*Math.PI/180,x2=cx+r*Math.cos(rad),y2=cy-r*Math.sin(rad);
  let arc='';
  if(deg===90) arc=`<path class="a" d="M${cx+18} ${cy} L${cx+18} ${cy-18} L${cx} ${cy-18}"/>`;
  else if(deg>=360) arc=`<circle class="a" cx="${cx}" cy="${cy}" r="26"/>`;
  else if(deg>0){const ax=cx+26*Math.cos(rad),ay=cy-26*Math.sin(rad);arc=`<path class="a" d="M${cx+26} ${cy} A26 26 0 ${deg>180?1:0} 0 ${ax.toFixed(2)} ${ay.toFixed(2)}"/>`;}
  return `<svg viewBox="0 0 220 220" role="img" aria-label="${deg} अंशाचा कोन">${arc}<line class="s" x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}"/><line class="s" x1="${cx}" y1="${cy}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/><circle cx="${cx}" cy="${cy}" r="4" fill="var(--margin)"/></svg>`;
}
const svgBox=(inner,vb='0 0 140 112')=>`<svg viewBox="${vb}" role="img">${inner}</svg>`;
const TRI={
  sam:`<polygon class="f" points="70,12 20,98 120,98"/>`, dvi:`<polygon class="f" points="70,10 40,100 100,100"/>`,
  vis:`<polygon class="f" points="20,100 120,100 48,26"/>`, kat:`<polygon class="f" points="25,18 25,100 118,100"/><path class="a" d="M25 86 H39 V100"/>`,
  lag:`<polygon class="f" points="18,100 118,100 64,22"/>`, vish:`<polygon class="f" points="10,100 82,100 126,42"/>`};
const QUAD={ayat:`<rect class="f" x="15" y="30" width="110" height="60"/>`,chaur:`<rect class="f" x="35" y="18" width="70" height="70"/>`,
  sambhuj:`<polygon class="f" points="70,8 118,56 70,104 22,56"/>`,samantar:`<polygon class="f" points="42,25 127,25 102,92 17,92"/>`,
  samlamb:`<polygon class="f" points="45,25 95,25 125,92 15,92"/>`,patang:`<polygon class="f" points="70,8 105,44 70,106 35,44"/>`};

/* ================= TOOLS (करून पाहा) ================= */
const TOOLS={};

TOOLS.solids={html:()=>`<h3 style="margin-top:0">चिती व सूचीचे घटक मोजा</h3>
<p>तळाच्या बहुभुजाकृतीच्या बाजू निवडा. चिती आणि सूचीचे शिरोबिंदू, पृष्ठे व कडा आपोआप दिसतील.</p>
<div class="row"><div><label>तळाच्या बाजूंची संख्या</label><select id="solN">${[3,4,5,6,7,8].map(n=>`<option value="${n}">${n} (${['त्रिकोण','चौकोन','पंचकोन','षट्‌कोन','सप्तकोन','अष्टकोन'][n-3]})</option>`).join('')}</select></div></div>
<div class="out" id="solOut"></div>`,
init(){const f=()=>{const n=+$('solN').value,nm=['त्रिकोणी','चौकोनी','पंचकोनी','षट्‌कोनी','सप्तकोनी','अष्टकोनी'][n-3];
  out($('solOut'),`<div class="scroll"><table><tr><th></th><th>${nm} चिती</th><th>${nm} सूची</th></tr>
  <tr><td>शिरोबिंदू</td><td>${2*n}</td><td>${n+1}</td></tr><tr><td>पृष्ठे</td><td>${n+2}</td><td>${n+1}</td></tr><tr><td>कडा</td><td>${3*n}</td><td>${2*n}</td></tr>
  <tr><td>उभी पृष्ठे</td><td>${n} आयताकृती</td><td>${n} त्रिकोणी</td></tr><tr><td>तळ / वरील पृष्ठ</td><td>2</td><td>1 (तळ)</td></tr></table></div>
  <p>चितीच्या कडा = तळाच्या बाजूंच्या तिप्पट (3 × ${n} = ${3*n}); सूचीच्या कडा = दुप्पट (2 × ${n} = ${2*n}).</p>`);};
  $('solN').onchange=f; f();}};

TOOLS.angle={html:()=>`<h3 style="margin-top:0">कोन बदलून पाहा</h3><p>स्लायडर हलवा किंवा माप लिहा.</p>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div id="angPic" style="width:200px;max-width:100%"></div><div style="flex:1;min-width:180px">
<label for="angR">कोनाचे माप (अंश)</label><input type="range" id="angR" min="0" max="360" value="60"><input id="angN" inputmode="numeric" value="60" style="margin-top:8px"><div class="out" id="angOut"></div></div></div>`,
init(){const r=$('angR'),n=$('angN'),draw=v=>{out($('angPic'),angleSVG(v));
  const t=v===0?'शून्य कोन':v<90?'लघुकोन':v===90?'काटकोन':v<180?'विशालकोन':v===180?'सरळकोन':v<360?'प्रविशाल कोन':'पूर्ण कोन';
  let h=`<p><span class="tag">${fmt(v)}°</span> हा <b>${t}</b> आहे.</p>`;
  if(std===7){h+=(v>0&&v<90)?`<p>कोटिकोन = 90° − ${fmt(v)}° = <b>${fmt(90-v)}°</b></p>`:`<p>कोटिकोन फक्त 0° ते 90° मधील कोनाला असतो.</p>`;
    h+=(v>0&&v<180)?`<p>पूरक कोन = 180° − ${fmt(v)}° = <b>${fmt(180-v)}°</b></p>`:`<p>पूरक कोन फक्त 0° ते 180° मधील कोनाला असतो.</p>`;}
  out($('angOut'),h);};
  r.oninput=()=>{n.value=r.value;draw(+r.value)}; n.oninput=()=>{const v=num(n.value); if(!isNaN(v)&&v>=0&&v<=360){r.value=v;draw(v)} else out($('angOut'),'<p class="err">0 ते 360 मधील माप लिहा.</p>')}; draw(60);}};

TOOLS.placeval={html:()=>`<h3 style="margin-top:0">स्थानिक किंमत व वाचन</h3><p>9 अंकांपर्यंतची संख्या लिहा. भारतीय पद्धतीनुसार स्वल्पविराम आणि प्रत्येक अंकाची स्थानिक किंमत दिसेल.</p>
<div class="row"><div><label>संख्या</label><input id="pvN" inputmode="numeric" value="356082140"></div></div><button class="go" id="pvGo">दाखवा</button><div class="out" id="pvOut"></div>`,
init(){const names=['एकक','दशक','शतक','हजार','दशहजार','लाख','दशलाख','कोटी','दशकोटी'];
  $('pvGo').onclick=()=>{const s=String($('pvN').value).trim().replace(/[०-९]/g,c=>MRD.indexOf(c)).replace(/,/g,'');

    const n=String(Number(s)),L=n.length; let ind=n.length>3?n.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+n.slice(-3):n;
    let rows='';for(let i=0;i<L;i++){const d=+n[i],p=L-1-i;rows+=`<tr><td>${names[p]}</td><td>${d}</td><td>${d}${'0'.repeat(p)}</td></tr>`;}

TOOLS.integer={html:()=>`<h3 style="margin-top:0">पूर्णांकांवरील क्रिया</h3>
<div class="row"><div><label>पहिली संख्या</label><input id="i1" inputmode="text" value="-8"></div>
<div><label>क्रिया</label><select id="iop"><option value="+">+ बेरीज</option><option value="-">− वजाबाकी</option>${std===7?'<option value="*">× गुणाकार</option><option value="/">÷ भागाकार</option>':''}</select></div>
<div><label>दुसरी संख्या</label><input id="i2" inputmode="text" value="5"></div></div>
<p style="font-size:14px;color:var(--muted)">ऋण संख्येसाठी आधी − चिन्ह लिहा (उदा. −8).</p><button class="go" id="iGo">उत्तर काढा</button><div class="out" id="iOut"></div>`,
init(){$('iGo').onclick=()=>{const a=num($('i1').value),b=num($('i2').value),op=$('iop').value,o=$('iOut');
  if(!Number.isInteger(a)||!Number.isInteger(b)||Math.abs(a)>999999||Math.abs(b)>999999) return out(o,'<p class="err">पूर्णांक संख्या लिहा (उदा. −25, 0, 14).</p>');
  let h='',r;
  if(op==='+'||op==='-'){let x=a,y=b; if(op==='-'){y=-b;h+=`<p>${par(a)} − ${par(b)} = ${par(a)} + ${par(y)} (दुसऱ्या संख्येची विरुद्ध संख्या मिळवली)</p>`;}
    r=x+y; if(x>=0&&y>=0) h+=`<p>दोन्ही धन : ${fmt(x)} + ${fmt(y)} = ${fmt(r)}</p>`;
    else if(x<0&&y<0) h+=`<p>दोन्ही ऋण : चिन्ह न पाहता ${fmt(-x)} + ${fmt(-y)} = ${fmt(-r)}, बेरजेला ऋण चिन्ह</p>`;
    else {const big=Math.abs(x)>=Math.abs(y)?x:y; h+=`<p>भिन्न चिन्हे : ${fmt(Math.max(Math.abs(x),Math.abs(y)))} − ${fmt(Math.min(Math.abs(x),Math.abs(y)))} = ${fmt(Math.abs(r))}${r===0?' (विरुद्ध संख्यांची बेरीज शून्य)':', मोठ्या संख्येचे चिन्ह '+(big<0?'ऋण':'धन')}</p>`;}}
  else if(op==='*'){r=a*b; h+=`<p>${fmt(Math.abs(a))} × ${fmt(Math.abs(b))} = ${fmt(Math.abs(r))}</p><p>${r===0?'एखादी संख्या 0 असल्यास गुणाकार 0.':(a<0)===(b<0)?'दोन्ही संख्यांची चिन्हे सारखी, म्हणून गुणाकार धन.':'चिन्हे भिन्न, म्हणून गुणाकार ऋण.'}</p>`;}
  else {if(b===0) return out(o,'<p class="err">कोणत्याही संख्येला 0 ने भागता येत नाही.</p>');
    const [p,q]=simp(a,b); r=a/b; h+=`<p>${par(a)} ÷ ${par(b)} = ${Number.isInteger(r)?neg(r):fracStr(p,q)}</p><p>${a===0?'0 ला कोणत्याही शून्येतर संख्येने भागल्यास 0.':(a<0)===(b<0)?'चिन्हे सारखी, म्हणून भागाकार धन.':'चिन्हे भिन्न, म्हणून भागाकार ऋण.'}</p>`;
    return out(o,h+`<p class="ans">उत्तर = ${Number.isInteger(r)?neg(r):fracStr(p,q)}</p>`);}
  out(o,h+`<p class="ans">उत्तर = ${neg(r)}</p>`);};}};

TOOLS.primes={html:()=>`<h3 style="margin-top:0">संख्या तपासा</h3>
<div class="row"><div><label>पहिली संख्या</label><input id="pr1" inputmode="numeric" value="11"></div><div><label>दुसरी संख्या (ऐच्छिक)</label><input id="pr2" inputmode="numeric" value="13"></div></div>
<button class="go" id="prGo">तपासा</button><div class="out" id="prOut"></div>
<h3>1 ते 100 मधील मूळ संख्या</h3><div id="prList"></div>`,
init(){const L=[];for(let i=2;i<=100;i++) if(isPrime(i)) L.push(i); out($('prList'),`<p>${L.join(', ')}</p><p>एकूण ${L.length} मूळ संख्या.</p>`);
  const kind=n=>n===1?'1 ही मूळही नाही आणि संयुक्तही नाही':isPrime(n)?`${n} ही मूळ संख्या (विभाजक फक्त 1 व ${n})`:`${n} ही संयुक्त संख्या (विभाजक : ${Array.from({length:n},(_,i)=>i+1).filter(d=>n%d===0).join(', ')})`;
  $('prGo').onclick=()=>{const a=num($('pr1').value),bs=$('pr2').value.trim(),o=$('prOut');
    if(!Number.isInteger(a)||a<1||a>100000) return out(o,'<p class="err">1 ते 100000 मधील पूर्ण संख्या लिहा.</p>');
    let h=`<p>${a<=500?kind(a):(a===1?kind(1):isPrime(a)?a+' ही मूळ संख्या':a+' ही संयुक्त संख्या')}. ${a%2===0?'ही सम संख्या आहे.':'ही विषम संख्या आहे.'}</p>`;
    if(bs){const b=num(bs); if(!Number.isInteger(b)||b<1||b>100000) return out(o,'<p class="err">दुसरी संख्याही 1 ते 100000 मधील लिहा.</p>');
      h+=`<p>${b<=500?kind(b):(isPrime(b)?b+' ही मूळ संख्या':b+' ही संयुक्त संख्या')}.</p>`;
      h+=`<p>${gcd(a,b)===1?`✅ ${a} व ${b} यांचा सामाईक विभाजक फक्त 1 आहे, म्हणून त्या <b>सहमूळ संख्या</b> आहेत.`:`${a} व ${b} सहमूळ नाहीत (सामाईक विभाजक ${gcd(a,b)}).`}</p>`;
      h+=`<p>${isPrime(a)&&isPrime(b)&&Math.abs(a-b)===2?`✅ दोन्ही मूळ संख्या असून फरक 2 आहे, म्हणून ही <b>जोडमूळ संख्यांची</b> जोडी आहे.`:'ही जोडमूळ संख्यांची जोडी नाही (दोन्ही मूळ संख्या आणि फरक 2 असायला हवा).'}</p>`;}
    out(o,h);};}};

TOOLS.patterns={html:()=>`<h3 style="margin-top:0">संख्यांचे आकृतिबंध</h3>
<div class="row"><div><label>मालिका</label><select id="ptT"><option value="odd">विषम संख्या</option><option value="even">सम संख्या</option><option value="tri">त्रिकोणी संख्या</option><option value="sq">चौरस संख्या</option><option value="cube">घन संख्या</option><option value="vir">विरहंक संख्या</option><option value="dbl">दुप्पट होणारी (1, 2, 4, …)</option></select></div>
<div><label>किती पदे?</label><input id="ptN" inputmode="numeric" value="10"></div></div><button class="go" id="ptGo">मालिका दाखवा</button><div class="out" id="ptOut"></div>`,
init(){const gen={odd:i=>2*i-1,even:i=>2*i,tri:i=>i*(i+1)/2,sq:i=>i*i,cube:i=>i*i*i,dbl:i=>Math.pow(2,i-1)};
  const rule={odd:'प्रत्येक पुढचे पद 2 ने मोठे',even:'प्रत्येक पुढचे पद 2 ने मोठे',tri:'1, 1+2, 1+2+3, … अशी बेरीज',sq:'1×1, 2×2, 3×3, …',cube:'1×1×1, 2×2×2, …',vir:'आधीच्या दोन पदांची बेरीज म्हणजे पुढचे पद',dbl:'प्रत्येक पुढचे पद आधीच्याच्या दुप्पट'};
  $('ptGo').onclick=()=>{const t=$('ptT').value,n=num($('ptN').value);
    if(!Number.isInteger(n)||n<1||n>25) return out($('ptOut'),'<p class="err">1 ते 25 मधील संख्या लिहा.</p>');
    let a=[]; if(t==='vir'){a=[0,1];while(a.length<n)a.push(a[a.length-1]+a[a.length-2]);a=a.slice(0,n);} else for(let i=1;i<=n;i++) a.push(gen[t](i));
    let extra=t==='tri'&&n>1?`<p>लागोपाठच्या दोन त्रिकोणी संख्यांची बेरीज चौरस संख्या असते : ${a[0]} + ${a[1]} = ${a[0]+a[1]}</p>`:'';
    if(t==='odd') extra=`<p>पहिल्या ${n} विषम संख्यांची बेरीज = ${a.reduce((x,y)=>x+y,0)} = ${n} × ${n}</p>`;
    out($('ptOut'),`<p class="ans">${a.join(', ')}</p><p>नियम : ${rule[t]}.</p>${extra}`);};}};

TOOLS.fractal={html:()=>`<h3 style="margin-top:0">त्रिकोणी फ्रॅक्टल</h3><p>समभुज त्रिकोणाच्या बाजूंचे मध्यबिंदू जोडून मधला त्रिकोण वगळा, आणि उरलेल्या त्रिकोणांसाठी तीच कृती पुन्हा करा.</p>
<label for="frL">पायरी : <b id="frV">2</b></label><input type="range" id="frL" min="0" max="5" value="2"><div id="frOut" style="max-width:360px;margin:auto"></div><p id="frC"></p>`,
init(){const draw=()=>{const L=+$('frL').value;let polys=[];
  const rec=(ax,ay,bx,by,cx,cy,d)=>{if(d===0){polys.push(`${ax},${ay} ${bx},${by} ${cx},${cy}`);return;}
    const abx=(ax+bx)/2,aby=(ay+by)/2,bcx=(bx+cx)/2,bcy=(by+cy)/2,cax=(cx+ax)/2,cay=(cy+ay)/2;
    rec(ax,ay,abx,aby,cax,cay,d-1);rec(abx,aby,bx,by,bcx,bcy,d-1);rec(cax,cay,bcx,bcy,cx,cy,d-1);};
  rec(150,10,10,252,290,252,L);
  out($('frOut'),`<svg viewBox="0 0 300 262" role="img" aria-label="फ्रॅक्टल">${polys.map(p=>`<polygon points="${p}" fill="var(--marigold)" stroke="var(--ink)" stroke-width="0.6"/>`).join('')}</svg>`);
  out($('frV'),String(L)); out($('frC'),`रंगवलेले त्रिकोण : ${polys.length} (प्रत्येक पायरीला 3 पट). कोणताही लहान भाग पूर्ण आकृतीसारखाच दिसतो – हेच फ्रॅक्टलचे वैशिष्ट्य.`);};
  $('frL').oninput=draw; draw();}};

TOOLS.hcf={html:()=>{const M=std===6?'म.सा.वि.':'मसावि',L=std===6?'ल.सा.वि.':'लसावि';return `<h3 style="margin-top:0">${M} – ${L} कॅल्क्युलेटर</h3>
<p>2 किंवा 3 संख्या लिहा (1 ते 99999). सर्व पद्धतींनी पायरीसह उत्तर मिळेल.</p>
<div class="row"><div><label>पहिली संख्या</label><input id="h1" inputmode="numeric" value="24"></div><div><label>दुसरी संख्या</label><input id="h2" inputmode="numeric" value="36"></div><div><label>तिसरी (ऐच्छिक)</label><input id="h3" inputmode="numeric" placeholder="रिकामी ठेवा"></div></div>
<button class="go" id="hGo">उत्तर काढा</button><div class="out" id="hOut"></div>`},
init(){$('hGo').onclick=calcHCF;}};
function calcHCF(){
  const M=std===6?'म.सा.वि.':'मसावि',LL=std===6?'ल.सा.वि.':'लसावि',o=$('hOut');
  const ns=['h1','h2','h3'].map(id=>$(id).value.trim()).filter(v=>v!=='').map(num);
  if(ns.length<2) return out(o,'<p class="err">किमान दोन संख्या लिहा.</p>');
  if(ns.some(n=>!Number.isInteger(n)||n<1||n>99999)) return out(o,'<p class="err">1 ते 99999 मधील पूर्ण संख्याच लिहा.</p>');
  const facs=ns.map(pf),cs=facs.map(counts),primes=[...new Set(facs.flat())].sort((a,b)=>a-b),H=ns.reduce(gcd),L=ns.reduce(lcm);
  let h='';
  if(Math.max(...ns)<=200){
    const divs=n=>Array.from({length:n},(_,i)=>i+1).filter(d=>n%d===0);
    h+=`<div class="sol"><div class="qq">विभाजक पद्धत (${M})</div>${ns.map(n=>`<div class="step">${n} चे विभाजक : ${divs(n).join(', ')}</div>`).join('')}`;
    const com=divs(Math.min(...ns)).filter(d=>ns.every(n=>n%d===0));
    h+=`<div class="step">सामाईक विभाजक : ${com.join(', ')}</div><div class="fin">सर्वांत मोठा सामाईक विभाजक = ${H}</div></div>`;
    if(L<=400){const mul=n=>{const a=[];for(let k=n;k<=L;k+=n)a.push(k);return a};
      h+=`<div class="sol"><div class="qq">विभाज्य पद्धत (${LL})</div>${ns.map(n=>`<div class="step">${n} चे विभाज्य : ${mul(n).join(', ')}${L/n<25?'':' …'}</div>`).join('')}<div class="fin">सर्वांत लहान सामाईक विभाज्य = ${L}</div></div>`;}
  }
  h+=`<div class="sol"><div class="qq">मूळ अवयव पद्धत</div>`;
  ns.forEach((n,i)=>{h+=`<div class="step">${n} = ${n===1?'1':facs[i].join(' × ')}</div>`;});
  const common=[];primes.forEach(p=>{const m=Math.min(...cs.map(c=>c[p]||0));for(let k=0;k<m;k++)common.push(p);});
  h+=common.length?`<div class="step">सामाईक मूळ अवयव : ${common.join(', ')}</div><div class="fin">${M} = ${common.join(' × ')} = ${H}</div>`:`<div class="fin">सामाईक मूळ अवयव नाही, ${M} = 1</div>`;
  const mx=[];primes.forEach(p=>{const m=Math.max(...cs.map(c=>c[p]||0));for(let k=0;k<m;k++)mx.push(p);});
  h+=`<div class="step">${LL} = सामाईक व असामाईक मूळ अवयवांचा गुणाकार (प्रत्येक मूळ अवयव, कोणत्याही एका संख्येत तो जास्तीत जास्त जितक्या वेळा आला तितक्या वेळा)</div><div class="fin">${LL} = ${mx.length?mx.join(' × '):'1'} = ${L}</div></div>`;
  const divTable=(x,y)=>{let a=Math.max(x,y),b=Math.min(x,y),rows='';while(true){const q=Math.floor(a/b),r=a%b;rows+=`<tr><td>${a}</td><td>${r===0?'<b>'+b+'</b>':b}</td><td>${q}</td><td>${r}</td></tr>`;if(r===0)break;a=b;b=r;}
    return `<div class="scroll"><table><tr><th>भाज्य</th><th>भाजक</th><th>भागाकार</th><th>बाकी</th></tr>${rows}</table></div>`;};
  const g1=gcd(ns[0],ns[1]);
  h+=`<div class="sol"><div class="qq">भागाकार पद्धत (${M})</div><div class="step">मोठ्या संख्येला लहानने भागा; बाकी 0 येईपर्यंत आधीच्या भाजकाला बाकीने भागत राहा.</div>${divTable(ns[0],ns[1])}<div class="step">बाकी 0 आली, म्हणून शेवटचा भाजक ${g1}.</div>`;
  if(ns.length===3) h+=`<div class="step">आता ${g1} व ${ns[2]} :</div>${divTable(g1,ns[2])}`;
  h+=`<div class="fin">${M} = ${H}</div></div>`;
  let cur=[...ns],rows='',dv=[];while(cur.some(x=>x>1)){const p=Math.min(...cur.filter(x=>x>1).map(spf));dv.push(p);rows+=`<tr><td class="dv">${p}</td>${cur.map(x=>`<td>${x}</td>`).join('')}</tr>`;cur=cur.map(x=>x%p===0?x/p:x);}
  rows+=`<tr><td></td>${cur.map(x=>`<td>${x}</td>`).join('')}</tr>`;
  h+=`<div class="sol"><div class="qq">${std===6?'उभी मांडणी पद्धत':'भागाकार (उभी मांडणी) पद्धत'} (${LL})</div><div class="scroll"><table>${rows}</table></div><div class="fin">${LL} = ${dv.length?dv.join(' × '):'1'} = ${L}</div></div>`;
  if(ns.length===2) h+=`<div class="rule">पडताळा : ${M} × ${LL} = ${H} × ${L} = ${H*L}, आणि ${ns[0]} × ${ns[1]} = ${ns[0]*ns[1]} ✓</div>`;
  out(o,h);
}

TOOLS.frac={html:()=>`<h3 style="margin-top:0">अपूर्णांक कॅल्क्युलेटर</h3>
<div class="row"><div><label>पहिला अंश</label><input id="fa" inputmode="numeric" value="1"></div><div><label>पहिला छेद</label><input id="fb" inputmode="numeric" value="2"></div></div>
<div class="row" style="margin-top:8px"><div><label>क्रिया</label><select id="fop"><option value="+">+ बेरीज</option><option value="-">− वजाबाकी</option><option value="c">तुलना (&lt;, =, &gt;)</option>${std===7?'<option value="*">× गुणाकार</option><option value="/">÷ भागाकार</option>':''}</select></div></div>
<div class="row" style="margin-top:8px"><div><label>दुसरा अंश</label><input id="fc" inputmode="numeric" value="1"></div><div><label>दुसरा छेद</label><input id="fd" inputmode="numeric" value="3"></div></div>
${std===7?'<p style="font-size:14px;color:var(--muted)">परिमेय संख्यांसाठी अंशात ऋण चिन्ह लिहू शकता (उदा. −3).</p>':''}
<button class="go" id="fGo">उत्तर काढा</button><div class="out" id="fOut"></div>`,
init(){$('fGo').onclick=()=>{const a=num($('fa').value),b=num($('fb').value),c=num($('fc').value),d=num($('fd').value),op=$('fop').value,o=$('fOut');
  const allowNeg=std===7;
  if([a,b,c,d].some(x=>!Number.isInteger(x)||Math.abs(x)>9999)||(!allowNeg&&[a,c].some(x=>x<0))||b<=0||d<=0) return out(o,`<p class="err">${allowNeg?'अंश पूर्णांक आणि छेद 1 किंवा जास्त पूर्ण संख्या लिहा.':'अंश 0 किंवा जास्त आणि छेद 1 किंवा जास्त पूर्ण संख्या लिहा.'}</p>`);
  const L=lcm(b,d),A=a*(L/b),C=c*(L/d); let h='',n,m;
  if(op==='c'){ if(b!==d) h+=`<p>छेद समान करू (छेदांचा ${std===6?'ल.सा.वि.':'लसावि'} ${L}) : ${sub(a)}/${b} = ${sub(A)}/${L}, ${sub(c)}/${d} = ${sub(C)}/${L}</p>`;
    const s=A>C?'&gt;':A<C?'&lt;':'=';return out(o,h+`<p>आता अंशांची तुलना : ${sub(A)} ${s} ${sub(C)}</p><p class="ans">${sub(a)}/${b} ${s} ${sub(c)}/${d}</p>`);}
  if(op==='+'||op==='-'){ if(b!==d) h+=`<p>छेदांचा ${std===6?'ल.सा.वि.':'लसावि'} = ${L} : ${sub(a)}/${b} = ${sub(A)}/${L}, ${sub(c)}/${d} = ${sub(C)}/${L}</p>`;
    n=op==='+'?A+C:A-C; m=L; if(n<0&&!allowNeg) return out(o,h+`<p class="err">उत्तर ऋण येते. मोठ्या अपूर्णांकातून लहान वजा करा.</p>`);
    h+=`<p>${sub(A)}/${L} ${op==='+'?'+':'−'} ${sub(C)}/${L} = ${sub(n)}/${L}</p>`;}
  else if(op==='*'){n=a*c;m=b*d;h+=`<p>(${sub(a)} × ${sub(c)}) / (${b} × ${d}) = ${sub(n)}/${m}</p>`;}
  else {if(c===0) return out(o,'<p class="err">0 ने भागाकार करता येत नाही.</p>'); n=a*d; m=b*c; h+=`<p>${sub(a)}/${b} ÷ ${sub(c)}/${d} = ${sub(a)}/${b} × ${d}/${sub(c)} (गुणाकार व्यस्ताने गुणले) = ${sub(n)}/${sub(m)}</p>`;}
  const [p,q]=simp(n,m); if(n!==0&&(p!==n||q!==m)) h+=`<p>अतिसंक्षिप्त रूप : ${sub(p)}/${q}</p>`;
  out(o,h+`<p class="ans">उत्तर = ${n===0?'0':fracStr(p,q)}</p>`);};}};

TOOLS.tri={html:()=>`<h3 style="margin-top:0">त्रिकोण ओळखा</h3>

<div class="row"><div><label>अंश</label><input id="da" inputmode="numeric" value="${std===7?'5':'3'}"></div><div><label>छेद</label><input id="db" inputmode="numeric" value="${std===7?'6':'4'}"></div></div>
<button class="go" id="dGo1">दशांश रूप काढा</button><div class="out" id="dOut1"></div>
<h3>दशांश → व्यवहारी अपूर्णांक</h3><div class="row"><div><label>दशांश संख्या</label><input id="dc" inputmode="decimal" value="0.25"></div></div>
<button class="go" id="dGo2">रूपांतर करा</button><div class="out" id="dOut2"></div>
<h3>विस्तारित रूप</h3><div class="row"><div><label>दशांश संख्या</label><input id="dx" inputmode="decimal" value="54.632"></div></div>
<button class="go" id="dGo3">विस्तारित रूप</button><div class="out" id="dOut3"></div>`,
init(){$('dGo1').onclick=()=>{const a=num($('da').value),b=num($('db').value),o=$('dOut1');
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<1||a>99999||b>9999) return out(o,'<p class="err">अंश 0 किंवा जास्त, छेद 1 किंवा जास्त लिहा.</p>');
    let ip=Math.floor(a/b),r=a%b,digs='',seen={},rep=-1;
    while(r&&digs.length<40){if(seen[r]!==undefined){rep=seen[r];break;}seen[r]=digs.length;r*=10;digs+=Math.floor(r/b);r%=b;}
    if(!r&&rep<0) return out(o,`<p>${a} ÷ ${b}</p><p class="ans">= ${digs?ip+'.'+digs:ip}</p><p>हे <b>${std===7?'खंडित दशांशरूप':'दशांश रूप'}</b> आहे (भागाकार पूर्ण होतो).</p>`);
    const fixed=digs.slice(0,rep),cyc=digs.slice(rep);
    out(o,`<p>${a} ÷ ${b}</p><p class="ans">= ${ip}.${fixed}<span style="text-decoration:overline">${cyc}</span></p><p>येथे "${cyc}" हा अंकसमूह पुन्हा पुन्हा येतो (${ip}.${fixed}${cyc}${cyc}${cyc}…). हे <b>आवर्ती दशांशरूप</b> आहे.</p>`);};
  $('dGo2').onclick=()=>{const t=String($('dc').value).trim().replace(/[०-९]/g,c=>MRD.indexOf(c)),o=$('dOut2');
    if(!/^\d+(\.\d{1,6})?$/.test(t)) return out(o,'<p class="err">उदा. 0.25 किंवा 3.5 असा दशांश लिहा.</p>');
    const dp=t.includes('.')?t.split('.')[1].length:0,den=Math.pow(10,dp),n=Math.round(Number(t)*den),[p,q]=simp(n,den);
    out(o,`<p>${t} = ${n}/${den}</p><p class="ans">= ${fracStr(p,q)}</p>`);};
  $('dGo3').onclick=()=>{const t=String($('dx').value).trim().replace(/[०-९]/g,c=>MRD.indexOf(c)),o=$('dOut3');
    if(!/^\d{1,6}(\.\d{1,3})?$/.test(t)) return out(o,'<p class="err">उदा. 54.632 (दशांशानंतर जास्तीत जास्त 3 अंक).</p>');
    const [w,f='']=t.split('.'),parts=[];
    for(let i=0;i<w.length;i++){const p=w.length-1-i;if(+w[i]) parts.push(`${w[i]} × ${Math.pow(10,p)}`);}
    for(let i=0;i<f.length;i++) if(+f[i]) parts.push(`${f[i]} × 1/${Math.pow(10,i+1)}`);
    out(o,`<p class="ans">${t} = ${parts.join(' + ')||'0'}</p><p style="font-size:14.5px;color:var(--muted)">1/10 = दशांश, 1/100 = शतांश, 1/1000 = सहस्रांश</p>`);};}};

TOOLS.profit={html:()=>`<h3 style="margin-top:0">नफा – तोटा</h3>
<div class="row"><div><label>मूळ खरेदी किंमत (₹)</label><input id="cp" inputmode="decimal" value="9500"></div><div><label>इतर खर्च (₹) (वाहतूक, मजुरी इ.)</label><input id="ox" inputmode="decimal" value="500"></div><div><label>विक्री किंमत (₹)</label><input id="sp" inputmode="decimal" value="12000"></div></div>
<button class="go" id="plGo">नफा / तोटा काढा</button><div class="out" id="plOut"></div>`,
init(){$('plGo').onclick=()=>{const c=num($('cp').value),x=$('ox').value.trim()===''?0:num($('ox').value),s=num($('sp').value),o=$('plOut');
  if([c,s].some(v=>isNaN(v)||v<=0)||isNaN(x)||x<0) return out(o,'<p class="err">किमती योग्य लिहा (इतर खर्च 0 असू शकतो).</p>');
  const T=c+x; let h=x?`<p>एकूण खरेदी किंमत = मूळ खरेदी किंमत + इतर खर्च = ${fmt(c)} + ${fmt(x)} = ₹${fmt(T)}</p>`:'';
  if(s===T) return out(o,h+'<p class="ans">ना नफा ना तोटा</p>');
  const p=s>T,amt=Math.abs(s-T);
  h+=`<p>${p?'नफा = विक्री किंमत − खरेदी किंमत':'तोटा = खरेदी किंमत − विक्री किंमत'} = ${p?fmt(s)+' − '+fmt(T):fmt(T)+' − '+fmt(s)}</p><p class="ans">${p?'नफा':'तोटा'} = ₹${fmt(amt)}</p>`;
  if(std===7) h+=`<p>शेकडा ${p?'नफा':'तोटा'} = (${fmt(amt)} ÷ ${fmt(T)}) × 100 = ${fmt(amt/T*100)}%</p>`;
  out(o,h);};}};

TOOLS.percent={html:()=>`<h3 style="margin-top:0">शेकडेवारी कॅल्क्युलेटर</h3>
<label>काय काढायचे आहे?</label><select id="pm"><option value="1">एखाद्या संख्येचे x% किती?</option><option value="2">a ही संख्या b च्या किती टक्के?</option><option value="3">अपूर्णांक → टक्के</option><option value="4">टक्के → अपूर्णांक</option><option value="5">सूट (discount) नंतरची किंमत</option></select>
<div class="row" style="margin-top:8px"><div><label id="pl1">टक्के (x)</label><input id="pa1" inputmode="decimal" value="25"></div><div id="pb"><label id="pl2">संख्या</label><input id="pa2" inputmode="decimal" value="80"></div></div>
<button class="go" id="pcGo">उत्तर काढा</button><div class="out" id="pcOut"></div>`,
init(){const labels={1:['टक्के (x)','संख्या'],2:['a','b'],3:['अंश','छेद'],4:['टक्के',''],5:['छापील किंमत (₹)','सूट (%)']};
  $('pm').onchange=()=>{const m=$('pm').value;out($('pl1'),labels[m][0]);out($('pl2'),labels[m][1]);$('pb').classList.toggle('hidden',m==='4');out($('pcOut'),'');};
  $('pcGo').onclick=()=>{const m=$('pm').value,a=num($('pa1').value),b=num($('pa2').value),o=$('pcOut');
    if(isNaN(a)||(m!=='4'&&isNaN(b))) return out(o,'<p class="err">संख्या नीट लिहा.</p>');
    if(m==='1') return out(o,`<p>${fmt(b)} चे ${fmt(a)}% = ${fmt(b)} × ${fmt(a)}/100</p><p class="ans">= ${fmt(b*a/100)}</p>`);
    if(m==='2'){if(b===0) return out(o,'<p class="err">b शून्य असू शकत नाही.</p>');return out(o,`<p>(${fmt(a)} ÷ ${fmt(b)}) × 100</p><p class="ans">= ${fmt(a/b*100)}%</p>`);}
    if(m==='3'){if(b===0) return out(o,'<p class="err">छेद शून्य असू शकत नाही.</p>');return out(o,`<p>${fmt(a)}/${fmt(b)} × 100</p><p class="ans">= ${fmt(a/b*100)}%</p>`);}
    if(m==='5'){if(a<=0||b<0||b>100) return out(o,'<p class="err">किंमत 0 पेक्षा जास्त आणि सूट 0 ते 100% लिहा.</p>');const d=a*b/100;return out(o,`<p>सूट = ${fmt(a)} × ${fmt(b)}/100 = ₹${fmt(d)}</p><p class="ans">द्यावी लागणारी किंमत = ${fmt(a)} − ${fmt(d)} = ₹${fmt(a-d)}</p>`);}
    let s=String(a),dec=s.includes('.')?Math.min(4,s.split('.')[1].length):0,n=Math.round(a*Math.pow(10,dec)),d=100*Math.pow(10,dec),[p,q]=simp(n,d);
    out(o,`<p>${fmt(a)}% = ${fmt(a)}/100</p><p class="ans">= ${fracStr(p,q)}</p>`);};}};

TOOLS.area6={html:()=>`<h3 style="margin-top:0">परिमिती व क्षेत्रफळ</h3>
<label>आकृती</label><select id="ar6"><option value="r">आयत</option><option value="s">चौरस</option><option value="t">त्रिकोण (पाया व उंची)</option><option value="rt">काटकोन त्रिकोण</option><option value="p">त्रिकोणाची परिमिती (3 बाजू)</option>${std===7?'<option value="cu">घनाचे पृष्ठफळ</option><option value="cd">इष्टिकाचितीचे पृष्ठफळ</option>':''}</select>
<div class="row" style="margin-top:8px"><div><label id="al1">लांबी</label><input id="av1" inputmode="decimal" value="8"></div><div id="aw2"><label id="al2">रुंदी</label><input id="av2" inputmode="decimal" value="7"></div><div id="aw3" class="hidden"><label id="al3">बाजू 3</label><input id="av3" inputmode="decimal" value="8"></div></div>
<div class="row" style="margin-top:8px"><div><label>एकक</label><select id="aun"><option>सेमी</option><option>मी</option><option>किमी</option></select></div></div>
<button class="go" id="arGo">उत्तर काढा</button><div class="out" id="arOut"></div>`,
init(){const L={r:['लांबी','रुंदी'],s:['बाजू'],t:['पाया','उंची'],rt:['काटकोन करणारी बाजू 1','काटकोन करणारी बाजू 2'],p:['बाजू 1','बाजू 2','बाजू 3'],cu:['बाजू'],cd:['लांबी','रुंदी','उंची']};
  const set=()=>{const k=$('ar6').value,l=L[k];out($('al1'),l[0]);$('aw2').classList.toggle('hidden',l.length<2);$('aw3').classList.toggle('hidden',l.length<3);if(l[1])out($('al2'),l[1]);if(l[2])out($('al3'),l[2]);out($('arOut'),'');};
  $('ar6').onchange=set;set();
  $('arGo').onclick=()=>{const k=$('ar6').value,u=$('aun').value,a=num($('av1').value),b=num($('av2').value),c=num($('av3').value),o=$('arOut'),need=L[k].length;
    const vals=[a,b,c].slice(0,need); if(vals.some(v=>isNaN(v)||v<=0)) return out(o,'<p class="err">सर्व मापे 0 पेक्षा मोठी लिहा.</p>');
    const sq='चौ'+u;
    if(k==='r') return out(o,`<p>परिमिती = 2 × (लांबी + रुंदी) = 2 × (${fmt(a)} + ${fmt(b)}) = <b>${fmt(2*(a+b))} ${u}</b></p><p class="ans">क्षेत्रफळ = ${fmt(a)} × ${fmt(b)} = ${fmt(a*b)} ${sq}</p>`);
    if(k==='s') return out(o,`<p>परिमिती = 4 × बाजू = 4 × ${fmt(a)} = <b>${fmt(4*a)} ${u}</b></p><p class="ans">क्षेत्रफळ = ${fmt(a)} × ${fmt(a)} = ${fmt(a*a)} ${sq}</p>`);
    if(k==='t'||k==='rt') return out(o,`<p>क्षेत्रफळ = (${k==='t'?'पाया × उंची':'काटकोन करणाऱ्या बाजूंचा गुणाकार'}) ÷ 2 = (${fmt(a)} × ${fmt(b)}) ÷ 2</p><p class="ans">= ${fmt(a*b/2)} ${sq}</p>`);
    if(k==='p'){const s=[a,b,c].sort((x,y)=>x-y);if(s[0]+s[1]<=s[2]) return out(o,'<p class="err">या बाजूंनी त्रिकोण तयार होत नाही (दोन बाजूंची बेरीज तिसरीपेक्षा जास्त हवी).</p>');return out(o,`<p class="ans">परिमिती = ${fmt(a)} + ${fmt(b)} + ${fmt(c)} = ${fmt(a+b+c)} ${u}</p>`);}
    if(k==='cu') return out(o,`<p>घनाला 6 समान चौरस पृष्ठे : पृष्ठफळ = 6 × बाजू × बाजू = 6 × ${fmt(a)} × ${fmt(a)}</p><p class="ans">= ${fmt(6*a*a)} ${sq}</p>`);
    return out(o,`<p>पृष्ठफळ = 2 × (ल × रुं + रुं × उं + ल × उं) = 2 × (${fmt(a*b)} + ${fmt(b*c)} + ${fmt(a*c)})</p><p class="ans">= ${fmt(2*(a*b+b*c+a*c))} ${sq}</p>`);};}};

TOOLS.pyth={html:()=>`<h3 style="margin-top:0">${std===6?'बौधायन–पायथागोरस':'पायथागोरस'} सिद्धांत वापरा</h3>
<h3>कर्ण काढा</h3><div class="row"><div><label>काटकोन करणारी बाजू 1</label><input id="p1" inputmode="decimal" value="12"></div><div><label>बाजू 2</label><input id="p2" inputmode="decimal" value="5"></div></div>
<button class="go" id="pGo">कर्ण काढा</button><div class="out" id="pOut"></div>
<h3>दुसरी बाजू काढा</h3><div class="row"><div><label>कर्ण</label><input id="p3" inputmode="decimal" value="10"></div><div><label>एक बाजू</label><input id="p4" inputmode="decimal" value="6"></div></div>
<button class="go" id="pGo2">बाजू काढा</button><div class="out" id="pOut2"></div>
<h3>त्रिकूट आहे का?</h3><div class="row"><div><label>a</label><input id="q1" inputmode="numeric" value="6"></div><div><label>b</label><input id="q2" inputmode="numeric" value="8"></div><div><label>c</label><input id="q3" inputmode="numeric" value="10"></div></div>
<button class="go" id="pGo3">तपासा</button><div class="out" id="pOut3"></div>`,
init(){const nice=v=>Math.abs(v-Math.round(v*100)/100)<1e-9;
  $('pGo').onclick=()=>{const a=num($('p1').value),b=num($('p2').value),o=$('pOut');if([a,b].some(x=>isNaN(x)||x<=0)) return out(o,'<p class="err">दोन्ही बाजू 0 पेक्षा मोठ्या लिहा.</p>');
    const c2=a*a+b*b,c=Math.sqrt(c2);out(o,`<p>(कर्ण)² = ${fmt(a)}² + ${fmt(b)}² = ${fmt(a*a)} + ${fmt(b*b)} = ${fmt(c2)}</p><p class="ans">कर्ण = ${nice(c)?'':'सुमारे '}${fmt(c)}</p>`);};
  $('pGo2').onclick=()=>{const h=num($('p3').value),a=num($('p4').value),o=$('pOut2');if([h,a].some(x=>isNaN(x)||x<=0)) return out(o,'<p class="err">दोन्ही लांबी 0 पेक्षा मोठ्या लिहा.</p>');
    if(a>=h) return out(o,'<p class="err">कर्ण ही सर्वांत मोठी बाजू असते.</p>');const b2=h*h-a*a,b=Math.sqrt(b2);
    out(o,`<p>(बाजू)² = ${fmt(h)}² − ${fmt(a)}² = ${fmt(h*h)} − ${fmt(a*a)} = ${fmt(b2)}</p><p class="ans">दुसरी बाजू = ${nice(b)?'':'सुमारे '}${fmt(b)}</p>`);};
  $('pGo3').onclick=()=>{const v=[num($('q1').value),num($('q2').value),num($('q3').value)],o=$('pOut3');if(v.some(x=>!Number.isInteger(x)||x<1||x>9999)) return out(o,'<p class="err">नैसर्गिक संख्या लिहा.</p>');
    const [x,y,z]=v.sort((p,q)=>p-q),ok=x*x+y*y===z*z;out(o,`<p>${x}² + ${y}² = ${x*x} + ${y*y} = ${x*x+y*y}; ${z}² = ${z*z}</p><p class="ans" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'होय, हे त्रिकूट आहे. या बाजूंचा त्रिकोण काटकोन त्रिकोण असतो.':'नाही, हे त्रिकूट नाही.'}</p>`);};}};

TOOLS.si={html:()=>`<h3 style="margin-top:0">सरळव्याज</h3>
<p>${std===6?'एका वर्षाचे व्याज = मुद्दल × दर ÷ 100. जास्त वर्षांसाठी त्याला वर्षांनी गुणा.':'चारपैकी कोणत्याही तीन किमती द्या; उरलेली (मुद्दल, दर, मुदत किंवा व्याज) काढा.'}</p>
<div class="row"><div><label>मुद्दल P (₹)</label><input id="si1" inputmode="decimal" value="20000"></div><div><label>दर R (द.सा.द.शे.)</label><input id="si2" inputmode="decimal" value="6"></div><div><label>मुदत N (वर्षे)</label><input id="si3" inputmode="decimal" value="1"></div>${std===7?'<div><label>व्याज I (₹)</label><input id="si4" inputmode="decimal" placeholder="काढायचे असल्यास रिकामे"></div>':''}</div>
<button class="go" id="siGo">उत्तर काढा</button><div class="out" id="siOut"></div>`,
init(){$('siGo').onclick=()=>{const g=id=>$(id)?$(id).value.trim():'',v=['si1','si2','si3','si4'].map(g),o=$('siOut');
  const blanks=v.map((x,i)=>i<3||std===7?x==='':false),nb=blanks.filter(Boolean).length;
  if(std===6||(nb===1&&blanks[3])||(nb===0)){const P=num(v[0]),R=num(v[1]),N=num(v[2]);if([P,R,N].some(x=>isNaN(x)||x<=0)) return out(o,'<p class="err">मुद्दल, दर व मुदत 0 पेक्षा जास्त लिहा.</p>');
    const I=P*R*N/100;return out(o,`<p>व्याज = ${fmt(P)} × ${fmt(R)} × ${fmt(N)} ÷ 100</p><p class="ans">व्याज = ₹${fmt(I)}</p><p>रास = मुद्दल + व्याज = ${fmt(P)} + ${fmt(I)} = <b>₹${fmt(P+I)}</b></p>`);}
  if(nb!==1) return out(o,'<p class="err">फक्त एकच चौकट रिकामी ठेवा.</p>');
  const [P,R,N,I]=v.map(x=>x===''?NaN:num(x)),i=blanks.indexOf(true);

  if(i===0) return out(o,`<p>मुद्दल = व्याज × 100 ÷ (दर × मुदत) = ${fmt(I)} × 100 ÷ (${fmt(R)} × ${fmt(N)})</p><p class="ans">मुद्दल = ₹${fmt(I*100/(R*N))}</p>`);
  if(i===1) return out(o,`<p>दर = व्याज × 100 ÷ (मुद्दल × मुदत) = ${fmt(I)} × 100 ÷ (${fmt(P)} × ${fmt(N)})</p><p class="ans">दर = द.सा.द.शे. ${fmt(I*100/(P*N))}</p>`);
  return out(o,`<p>मुदत = व्याज × 100 ÷ (मुद्दल × दर) = ${fmt(I)} × 100 ÷ (${fmt(P)} × ${fmt(R)})</p><p class="ans">मुदत = ${fmt(I*100/(P*R))} वर्षे</p>`);};}};

TOOLS.freq={html:()=>`<h3 style="margin-top:0">वारंवारता सारणी तयार करा</h3><p>प्राप्तांक स्वल्पविरामाने लिहा (उदा. वर्गातील गुण).</p>

init(){$('frGo').onclick=()=>{const raw=$('frIn').value.replace(/[०-९]/g,c=>MRD.indexOf(c)).split(/[,\s]+/).filter(Boolean).map(Number),o=$('frOutT');

TOOLS.bargraph={html:()=>`<h3 style="margin-top:0">${std===7?'जोडस्तंभालेख':'स्तंभालेख'} काढा</h3><p>प्रत्येक ओळीत नाव व संख्या लिहा (जास्तीत जास्त 6 ओळी).</p>

${[['आंबा',12,''],['केळे',8,''],['पेरू',6,''],['चिकू',10,''],['',''],['','']].map((d,i)=>{const v7=std===7?[[18,20],[22,19],[15,17],[20,24],['',''],['','']][i]:null;return `<div class="row" style="margin-top:6px"><div><input id="bn${i}" placeholder="नाव" value="${std===7&&i<4?['इ. 5 वी','इ. 6 वी','इ. 7 वी','इ. 8 वी'][i]:d[0]}"></div><div><input id="bv${i}" inputmode="decimal" placeholder="संख्या" value="${std===7?v7[0]:d[1]}"></div>${std===7?`<div><input id="bw${i}" inputmode="decimal" placeholder="संख्या 2" value="${v7[1]}"></div>`:''}</div>`}).join('')}
<button class="go" id="bGo">आलेख काढा</button><div class="out" id="bOut"></div>`,
init(){$('bGo').onclick=()=>{const two=std===7,d=[];
  for(let i=0;i<6;i++){const n=$('bn'+i).value.trim(),v=$('bv'+i).value.trim(),w=two?$('bw'+i).value.trim():'';if(!n&&!v&&!w) continue;
    const a=num(v),b=two?num(w):0; if(!n||isNaN(a)||a<0||(two&&(isNaN(b)||b<0))||a>1e6||b>1e6) return out($('bOut'),'<p class="err">प्रत्येक भरलेल्या ओळीत नाव व 0 किंवा जास्त संख्या लिहा.</p>'); d.push([n,a,b]);}
  if(d.length<2) return out($('bOut'),'<p class="err">किमान दोन ओळी भरा.</p>');
  const mx=Math.max(...d.map(x=>Math.max(x[1],x[2])))||1,steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000,10000,50000,100000,200000];
  const st=steps.find(s=>mx/s<=8)||200000,top=Math.ceil(mx/st)*st,sc=150/top,gw=two?70:60,W=Math.max(300,70+d.length*gw);
  let s=`<svg viewBox="0 0 ${W} 225" style="width:100%;max-width:${W+80}px" role="img">`;
  for(let v=0;v<=top;v+=st) s+=`<line x1="52" x2="${W-4}" y1="${180-v*sc}" y2="${180-v*sc}" stroke="var(--line)"/><text x="46" y="${185-v*sc}" text-anchor="end" style="font-size:12px">${fmt(v)}</text>`;
  s+=`<line class="s" x1="52" y1="180" x2="${W-4}" y2="180"/><line class="s" x1="52" y1="20" x2="52" y2="180"/>`;
  d.forEach((x,i)=>{const X=66+i*gw;
    if(two){s+=`<rect x="${X}" y="${180-x[1]*sc}" width="24" height="${x[1]*sc}" fill="var(--marigold)" stroke="var(--ink)"/><rect x="${X+26}" y="${180-x[2]*sc}" width="24" height="${x[2]*sc}" fill="var(--ok)" stroke="var(--ink)"/>`;}
    else s+=`<rect x="${X}" y="${180-x[1]*sc}" width="34" height="${x[1]*sc}" fill="var(--marigold)" stroke="var(--ink)"/>`;
    s+=`<text x="${X+(two?25:17)}" y="198" text-anchor="middle" style="font-size:12px">${escH(x[0].slice(0,9))}</text>`;});
  s+='</svg>';
  const leg=two?`<p><span style="display:inline-block;width:14px;height:14px;background:var(--marigold);border:1px solid var(--ink);vertical-align:middle"></span> ${escH($('bs1').value||'माहिती 1')} &nbsp; <span style="display:inline-block;width:14px;height:14px;background:var(--ok);border:1px solid var(--ink);vertical-align:middle"></span> ${escH($('bs2').value||'माहिती 2')}</p>`:'';
  out($('bOut'),s+leg+`<p>प्रमाण : Y-अक्षावर एक भाग = ${fmt(st)}. X-अक्षावर माहितीचे प्रकार.</p>`);};}};

TOOLS.hanoi={html:()=>`<h3 style="margin-top:0">ब्रह्मा टॉवर (Tower of Hanoi)</h3>
<p>सर्व चकत्या पहिल्या दांड्यावरून तिसऱ्या दांड्यावर न्या. एका वेळी एकच चकती; लहान चकतीवर मोठी चकती ठेवायची नाही. आधी दांडा टॅप करा, मग जिथे न्यायचे तो दांडा टॅप करा.</p>
<div class="row"><div><label>चकत्या</label><select id="hnN"><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div></div>
<div class="hanoi" id="hn"></div><p id="hnInfo"></p><button class="go alt" id="hnR">पुन्हा सुरू करा</button>`,
init(){const cols=['#e89b12','#cf4638','#2656a0','#1d8a4b','#7a5a3a','#8a4fbf'];let P,sel,moves,N;
  const draw=()=>{const el=$('hn');el.innerHTML=P.map((p,i)=>`<div class="peg${sel===i?' sel':''}" data-i="${i}" role="button" aria-label="दांडा ${i+1}">${p.map(d=>`<div class="disk" style="width:${24+d*14}%;background:${cols[d-1]}"></div>`).join('')}</div>`).join('');
    el.querySelectorAll('.peg').forEach(g=>g.onclick=()=>tap(+g.dataset.i));
    const win=P[2].length===N;out($('hnInfo'),win?`🎉 पूर्ण! हालचाली : ${moves}. कमीत कमी हालचाली = 2<sup>${N}</sup> − 1 = ${Math.pow(2,N)-1}.`:`हालचाली : ${moves} &nbsp;•&nbsp; लक्ष्य : ${Math.pow(2,N)-1} हालचाली`);};
  const tap=i=>{if(P[2].length===N) return; if(sel===null){if(P[i].length) sel=i;} else {if(i!==sel){const d=P[sel][P[sel].length-1],t=P[i][P[i].length-1];if(t===undefined||t>d){P[i].push(P[sel].pop());moves++;}} sel=null;} draw();};
  const reset=()=>{N=+$('hnN').value;P=[Array.from({length:N},(_,k)=>N-k),[],[]];sel=null;moves=0;draw();};
  $('hnN').onchange=reset;$('hnR').onclick=reset;reset();}};

TOOLS.power={html:()=>`<h3 style="margin-top:0">घातांकित संख्येची किंमत</h3>
<div class="row"><div><label>पाया a</label><input id="pwA" inputmode="text" value="-2"></div><div><label>घातांक m</label><input id="pwM" inputmode="text" value="5"></div></div>
<button class="go" id="pwGo">किंमत काढा</button><div class="out" id="pwOut"></div>
<h3>पूर्ण वर्ग संख्येचे वर्गमूळ</h3><div class="row"><div><label>संख्या</label><input id="sqN" inputmode="numeric" value="784"></div></div>
<button class="go" id="sqGo">वर्गमूळ काढा</button><div class="out" id="sqOut"></div>`,
init(){$('pwGo').onclick=()=>{const a=num($('pwA').value),m=num($('pwM').value),o=$('pwOut');
    if(!Number.isInteger(a)||!Number.isInteger(m)||Math.abs(a)>50||Math.abs(m)>10) return out(o,'<p class="err">पाया −50 ते 50 व घातांक −10 ते 10 मधील पूर्णांक लिहा.</p>');
    if(a===0&&m<=0) return out(o,'<p class="err">पाया 0 असताना घातांक धन असावा.</p>');
    if(m===0) return out(o,`<p>शून्येतर संख्येचा घात 0 असल्यास किंमत 1 असते.</p><p class="ans">(${sub(a)})<sup>0</sup> = 1</p>`);
    const k=Math.abs(m),v=Math.pow(a,k),A=a<0?`(${sub(a)})`:String(a);
    if(m>0) return out(o,`<p>${A}<sup>${m}</sup> = ${Array(k).fill(A).join(' × ')}</p><p class="ans">= ${neg(v)}</p>${a<0?`<p>ऋण संख्येचा ${k%2?'विषम':'सम'} घात ${k%2?'ऋण':'धन'} असतो.</p>`:''}`);
    const [p,q]=simp(1,v);out(o,`<p>${A}<sup>${sub(m)}</sup> = 1 / ${A}<sup>${k}</sup> = 1 / ${neg(v)}</p><p class="ans">= ${fracStr(p,q)}</p>`);};
  $('sqGo').onclick=()=>{const n=num($('sqN').value),o=$('sqOut');if(!Number.isInteger(n)||n<1||n>1000000) return out(o,'<p class="err">1 ते 1000000 मधील पूर्ण संख्या लिहा.</p>');
    const f=pf(n),c=counts(f),ok=Object.values(c).every(x=>x%2===0);
    if(!ok) return out(o,`<p>${n} = ${f.join(' × ')}</p><p class="err">सर्व मूळ अवयवांच्या जोड्या होत नाहीत, म्हणून ${n} ही पूर्ण वर्ग संख्या नाही.</p>`);
    const half=[];Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(p=>{for(let i=0;i<c[p]/2;i++)half.push(p)});
    out(o,`<p>${n} = ${f.join(' × ')}</p><p>प्रत्येक जोडीतील एक अवयव घ्या : ${half.join(' × ')||'1'}</p><p class="ans">√${n} = ${Math.round(Math.sqrt(n))}</p>`);};}};

<div class="card"><h2>बिंदू, रेषा, प्रतल</h2>
<div class="def"><b>बिंदू :</b> टोकदार पेन्सिलने केलेली खूण. नाव : बिंदू P, बिंदू Q.</div>
<div class="def"><b>रेषा :</b> एकमितीय, दोन्ही बाजूंनी अमर्याद (टोकांवर बाण). रेषेवर असंख्य बिंदू असतात. नाव : रेषेवरील कोणत्याही दोन बिंदूंनी (रेषा DE किंवा रेषा ED) किंवा एका लहान अक्षराने (रेषा m).</div>
<div class="def"><b>एकरेषीय व नैकरेषीय बिंदू :</b> तीन किंवा अधिक बिंदूंतून एकच रेषा जात असेल तर ते एकरेषीय बिंदू; एकही रेषा जात नसेल तर नैकरेषीय बिंदू. (एका बिंदूतून अगणित रेषा जातात; दोन बिंदूंतून एकच रेषा जाते.)</div>
<div class="def"><b>प्रतल :</b> सर्व बाजूंनी अमर्याद असलेला सपाट पृष्ठभाग. फळा, टेबलाचा पृष्ठभाग हे प्रतलाचे भाग. नाव : प्रतल E.</div>
<div class="def"><b>रेषाखंड :</b> रेषेवरील दोन बिंदूंमधील भाग; त्याला दोन अंत्यबिंदू असतात. नाव : रेख PQ किंवा रेख QP. दोन बिंदू जोडणारा सर्वांत लहान मार्ग म्हणजे रेषाखंड.</div>

<div class="card"><h2>पदावली</h2>
<div class="eg">64 ÷ (5 + 3) − 3 = 64 ÷ 8 − 3 = 8 − 3 = 5 &nbsp;(आधी कंस)</div>
<div class="eg">[12 + 3 × 5] + 40 = [12 + 15] + 40 = 27 + 40 = 67</div>
<p>कंसांचे प्रकार : साधा ( ), महिरपी { }, चौकटी [ ]. सर्वांत आतील कंस प्रथम सोडवा.</p></div>
<div class="card"><h2>समानता</h2>
<div class="eg">6 × 5 = 30 आणि 14 + 16 = 30 → 6 × 5 = 14 + 16 (समानता आहे)<br>30 ÷ 15 = 2 आणि 18 − 8 = 10 → 30 ÷ 15 ≠ 18 − 8</div>
<div class="rule">(6 + 4) = (5 × 2) या समानतेत दोन्ही बाजूंना 5 मिळवले, 2 वजा केले, 3 ने गुणले किंवा 2 ने भागले तरी समानताच मिळते.</div></div>
<div class="card"><h2>अक्षरांचा वापर</h2>
<p>माहीत नसलेल्या संख्येसाठी अक्षर (चल) वापरतात : a, b, x, y …</p>
<div class="eg">एका संख्येपेक्षा 7 ने मोठी संख्या = a + 7<br>एका संख्येपेक्षा 4 ने लहान संख्या = a − 4<br>15 मधून एक संख्या वजा केल्यास = 15 − a<br>एका संख्येची 5 पट = 5a (अक्षराआधी संख्या, गुणाकार चिन्ह लिहीत नाहीत)</div>
<p>सूत्रांसाठीही अक्षरे वापरतात : वर्तुळाचा व्यास d = 2r (r = त्रिज्या). नियम : a + b = b + a, a + 0 = a, a × b = b × a, a × 1 = a.</p></div>

<div class="card"><h2>1. जादूची कार्डे</h2><p>मित्राला 1 ते 31 मधील संख्या मनात धरायला सांगा आणि ती कोणत्या कार्डांवर आहे ते विचारा. "करून पाहा" विभागात हा खेळ खेळा आणि त्यामागचे गुपित शोधा.</p></div>
<div class="card"><h2>2. चांदणी व सुसम पंचकोन</h2>
<p>पाच टोकांच्या चांदणीच्या मध्यभागी सुसम पंचकोन तयार होतो. खालील तीन माहितीच्या आधारे चांदणीतील कोन शोधता येतात :</p>
<ul><li>सरळ रेषेवर शेजारी असणाऱ्या दोन कोनांची बेरीज 180° असते.</li><li>सुसम पंचकोनाच्या सर्व बाजू व सर्व कोन समान असतात.</li><li>त्रिकोणाच्या तिन्ही कोनांची बेरीज 180° असते.</li></ul>
<div class="eg">पंचकोनाचे 3 त्रिकोण होतात : कोनांची बेरीज = 3 × 180° = 540°. सुसम पंचकोनाचा प्रत्येक कोन = 540° ÷ 5 = 108°.</div>
<p>विचार करा : n बाजूंच्या बहुभुजाकृतीचे (n − 2) त्रिकोण होतात; म्हणून कोनांची बेरीज = (n − 2) × 180°.</p></div>
<div class="card"><h2>3. पेन्टोमिनो</h2><p>5 चौरस जोडून 12 वेगवेगळे आकार होतात; त्यांना आकारानुसार F, I, L, N, P, T, U, V, W, X, Y, Z अशी इंग्लिश अक्षरे देतात. 12 पेन्टोमिनोंचे एकूण क्षेत्रफळ 12 × 5 = 60 चौरस, म्हणून ते 6 × 10, 5 × 12, 4 × 15 किंवा 3 × 20 चौरसांच्या आयतात फटी न ठेवता व एकमेकांवर न येता बसवता येतात.</p></div>
<div class="card"><h2>4. बेरीज-वजाबाकी चौकट</h2><p>चौकटीत आडव्या ओळींची बेरीज व उभ्या स्तंभांची वजाबाकी करायची असते. शेवटच्या कोपऱ्यात दोन्ही मार्गांनी एकच उत्तर येते का ते तपासा. अशा चौकटी अपूर्णांकांसाठीही तयार करता येतात.</p></div>`,

<div class="card"><h2>अंतर्मध्य व परिकेंद्र</h2>
<div class="def"><b>अंतर्मध्य (incentre) :</b> तिन्ही कोनदुभाजकांचा संपातबिंदू I. I पासून बाजूंवर टाकलेले लंब समान लांबीचे असतात (IA = IB = IC).</div>
<div class="def"><b>परिकेंद्र (circumcentre) :</b> तिन्ही बाजूंच्या लंबदुभाजकांचा संपातबिंदू C. C पासून शिरोबिंदू समान अंतरावर (CX = CY = CZ).</div>
<p>लघुकोन त्रिकोणाचे परिकेंद्र त्रिकोणाच्या अंतर्भागात, काटकोन त्रिकोणाचे कर्णाच्या मध्यबिंदूवर आणि विशालकोन त्रिकोणाचे बाह्यभागात असते.</p></div>
<div class="card"><h2>त्रिकोणाच्या रचना</h2>
<h3>(I) तीन बाजू दिल्या असता</h3><ol><li>सर्वांत मोठी बाजू पाया म्हणून काढा (उदा. रेख XY).</li><li>X केंद्र घेऊन दुसऱ्या बाजूच्या लांबीचा कंस काढा.</li><li>Y केंद्र घेऊन तिसऱ्या बाजूच्या लांबीचा कंस पहिल्या कंसाला छेदेल असा काढा; छेदनबिंदू Z.</li><li>XZ व YZ जोडा.</li></ol>
<p>कोणत्याही दोन बाजूंची बेरीज तिसऱ्या बाजूपेक्षा जास्त असेल तरच त्रिकोण तयार होतो.</p>
<h3>(II) दोन बाजू व त्यांमधील कोन दिला असता</h3><ol><li>एक बाजू पाया म्हणून काढा (रेख PQ).</li><li>P वर कोनमापकाने दिलेल्या मापाचा कोन करणारा किरण काढा.</li><li>त्या किरणावर दुसऱ्या बाजूच्या लांबीवर बिंदू R घ्या. QR जोडा.</li></ol>
<h3>(III) दोन कोन व त्यांमधील बाजू दिली असता</h3><ol><li>दिलेली बाजू पाया म्हणून काढा.</li><li>पायाच्या दोन्ही टोकांवर दिलेल्या मापांचे कोन काढा.</li><li>दोन किरणांचा छेदनबिंदू म्हणजे तिसरा शिरोबिंदू.</li></ol>
<p>दोन कोनांची बेरीज 180° पेक्षा कमी असायला हवी.</p>
<h3>(IV) कर्ण व एक बाजू दिली असता (काटकोन त्रिकोण)</h3><ol><li>दिलेली बाजू काढा (रेख MN).</li><li>M वर 90° चा कोन करणारा किरण काढा.</li><li>N केंद्र घेऊन कर्णाच्या लांबीचा कंस त्या किरणाला छेदेल असा काढा; छेदनबिंदू L. LN जोडा.</li></ol></div>`,

/* ================= progress (stored on this phone) ================= */
function progKey(){ const p=window.NK&&NK.profile; return 'nkm-prog-'+(p&&p.phone?p.phone:'guest'); }
function getProg(){ try{return JSON.parse(localStorage.getItem(progKey())||'{}')}catch(e){return {}} }
function setProg(p){ try{localStorage.setItem(progKey(),JSON.stringify(p))}catch(e){} }
function chapters(s){ return (s||std)===6?CH6:CH7; }
function pstd(p,s){ s=s||std; p[s]=p[s]||{done:{},best:{}}; return p[s]; }
function starStr(best,total){ if(best==null) return ''; const r=best/total; return r>=0.9?'★★★':r>=0.6?'★★☆':'★☆☆'; }

/* ================= quiz engine ================= */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function runQuiz(box,questions,onDone){
  const Q=questions.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),e:q.e};});
  let i=0,score=0,marks=[];
  const dots=()=>`<div class="qdots">${Q.map((_,k)=>`<i class="${k<marks.length?(marks[k]?'r':'w'):k===i?'c':''}"></i>`).join('')}</div>`;
  const show=()=>{const q=Q[i];
    out(box,`<div class="qz">${dots()}<p style="margin:0;color:var(--muted);font-size:14px">प्रश्न ${i+1} / ${Q.length}</p><p class="qtext">${q.q}</p>${q.o.map((t,j)=>`<button class="opt" data-j="${j}">${t}</button>`).join('')}<div id="qw"></div></div>`);
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      box.querySelectorAll('.opt').forEach(x=>x.disabled=true);const j=+b.dataset.j,ok=j===q.a;
      if(ok){b.classList.add('right');score++;} else {b.classList.add('wrong');box.querySelectorAll('.opt')[q.a].classList.add('right');}
      marks.push(ok);
      out(box.querySelector('#qw'),`<div class="why">${ok?'✅ बरोबर! ':'❌ चुकले. '}${q.e}</div><button class="go" id="qn">${i+1<Q.length?'पुढील प्रश्न →':'निकाल पाहा'}</button>`);
      box.querySelector('.qdots').outerHTML=dots(); convertDigits(box);
      const nb=box.querySelector('#qn'); nb.focus({preventScroll:true});
      nb.onclick=()=>{i++; if(i<Q.length) show(); else finish();};});};
  const finish=()=>{const r=score/Q.length,st=starStr(score,Q.length);
    out(box,`<div class="qz result"><div class="big">${r>=0.9?'🏆':r>=0.6?'👍':'💪'}</div><b>गुण : ${score} / ${Q.length}</b><p style="font-size:26px;color:var(--marigold);margin:4px 0">${st}</p>
    <p>${r>=0.9?'उत्कृष्ट! तुम्ही हा घटक चांगला शिकलात.':r>=0.6?'छान! चुकलेले प्रश्न पुन्हा समजून घ्या.':'पुन्हा "समजून घ्या" वाचा आणि परत प्रयत्न करा.'}</p>
    <button class="go" id="qAgain">पुन्हा सोडवा</button></div>`);
    box.querySelector('#qAgain').onclick=()=>runQuiz(box,questions,onDone); onDone&&onDone(score,Q.length);};
  show();
}

function renderHome(){
  bar.classList.add('hidden'); const P=getProg();
  const pct=s=>{const d=Object.keys((P[s]||{}).done||{}).length;return Math.round(d/chapters(s).length*100);};
  const last=P.last&&chapters(P.last.std).find(c=>c.n===P.last.n);
  out(app,`<div class="page"><section class="hero"><h1>Nayan Kalpande Math<span>गणित – समजून घ्या, सराव करा</span></h1>
  <p>जिल्हा परिषद शाळांतील विद्यार्थ्यांसाठी मराठी माध्यम गणित.</p></section>
  ${window.NK&&NK.profile?`<div class="hello"><span>नमस्कार, <b>${escH(String(NK.profile.name).split(' ')[0])}</b> 👋</span><button class="iconbtn" id="hTop">🏆 टॉप १०</button><button class="iconbtn" id="hAcc" aria-label="माझे खाते">👤</button></div>`:''}
  ${last?`<button class="cont" id="cont"><span style="font-size:30px">▶️</span><span><b>पुढे सुरू ठेवा</b><span>इयत्ता ${P.last.std} वी · प्रकरण ${last.n} : ${escH(last.t)}</span></span></button>`:''}
  <h2 style="margin:20px 0 0;font-size:21px">तुमची इयत्ता निवडा</h2>
  <div class="std-grid">
   <button class="std-tile ${std===6?'chosen':''}" data-s="6"><span class="num">६</span><b>इयत्ता सहावी</b><small>19 पाठ · नवीन पाठ्यपुस्तक (2026)</small><div class="pbar"><i style="width:${pct(6)}%"></i></div><small>${pct(6)}% पूर्ण</small></button>
   <button class="std-tile ${std===7?'chosen':''}" data-s="7"><span class="num">७</span><b>इयत्ता सातवी</b><small>15 प्रकरणे</small><div class="pbar"><i style="width:${pct(7)}%"></i></div><small>${pct(7)}% पूर्ण</small></button>
  </div>
  <p class="note">महाराष्ट्र राज्य मंडळाच्या (बालभारती) इयत्ता ६ वी (2026) व ७ वी गणित पाठ्यपुस्तकांतील सर्व पाठांवर आधारित स्पष्टीकरण, सोडवलेली उदाहरणे, साधने व सराव. पाठ्यपुस्तकासोबत वापरा.</p></div>`);
  app.querySelectorAll('.std-tile').forEach(b=>b.onclick=()=>{std=+b.dataset.s;try{localStorage.setItem('nkm-std',std)}catch(e){}go({screen:'list'});});
  if($('cont')) $('cont').onclick=()=>{std=P.last.std;try{localStorage.setItem('nkm-std',std)}catch(e){}go({screen:'ch',n:P.last.n,tab:P.last.tab||'notes'});};
  if($('hTop')) $('hTop').onclick=()=>NK.showTop10(); if($('hAcc')) $('hAcc').onclick=()=>NK.showProfile();
}

function renderList(){
  setBar(stdWord(),'Nayan Kalpande Math'); const P=getProg(),ps=pstd(P),C=chapters(),done=Object.keys(ps.done).length;
  out(app,`<div class="page"><div class="head2"><h2>पाठ्यपुस्तकातील ${std===6?'पाठ':'प्रकरणे'}</h2><span class="prog">${done} / ${C.length} पूर्ण</span></div>
  <div class="lpbar"><i style="width:${Math.round(done/C.length*100)}%"></i></div>
  <div class="search"><input id="srch" placeholder="पाठ शोधा… (उदा. कोन, व्याज)" aria-label="पाठ शोधा"></div>
  <div id="clist">${C.map(c=>`<button class="chap ${ps.done[c.n]?'done':''}" data-n="${c.n}" data-k="${escH(c.t+' '+c.en)}"><span class="no">${c.n}</span><span class="tx"><b>${escH(c.t)}</b><span>${escH(c.en)}</span></span><span class="stars">${starStr(ps.best[c.n],c.q.length)}</span></button>`).join('')}</div>
  <p id="noRes" class="hidden" style="color:var(--muted)">असा पाठ सापडला नाही.</p>
  <div class="extra"><button class="xbtn wide" id="mix"><b>📝 सर्व पाठांवरील मिश्र चाचणी</b><span>प्रत्येक वेळी वेगवेगळे 15 प्रश्न</span></button>
  ${window.NK?`<button class="xbtn" id="mTop"><b>🏆 टॉप १०</b><span>सर्वाधिक अभ्यास करणारे</span></button><button class="xbtn" id="mAcc"><b>👤 माझे खाते</b><span>माहिती, लॉग आउट</span></button>`:''}</div></div>`);
  app.querySelectorAll('.chap').forEach(b=>b.onclick=()=>go({screen:'ch',n:+b.dataset.n,tab:'notes'}));
  $('srch').oninput=()=>{const t=$('srch').value.trim().toLowerCase();let any=0;app.querySelectorAll('.chap').forEach(b=>{const m=!t||b.dataset.k.toLowerCase().includes(t)||String(b.dataset.n)===t;b.classList.toggle('hidden',!m);if(m)any++;});$('noRes').classList.toggle('hidden',!!any);};
  $('mix').onclick=()=>go({screen:'mix'});
  if($('mTop')) $('mTop').onclick=()=>NK.showTop10(); if($('mAcc')) $('mAcc').onclick=()=>NK.showProfile();
}

const TABS=[['notes','📘 समजून घ्या'],['ex','✏️ सोडवलेली उदाहरणे'],['tool','🧮 करून पाहा'],['quiz','✅ सराव']];
function renderChapter(n,tab){
  const C=chapters(),c=C.find(x=>x.n===n); if(!c) return go({screen:'list'},true);
  setBar(`${n}. ${c.t}`,stdWord()); const P=getProg(); P.last={std,n,tab}; setProg(P); const ps=pstd(P);
  const idx=C.indexOf(c),prev=C[idx-1],next=C[idx+1];
  out(app,`<div class="page"><div class="chhead"><span class="no">${n}</span><div><h2>${escH(c.t)}</h2><small>${escH(c.en)} · ${stdWord()}</small></div></div>
  <div class="tabs" role="tablist">${TABS.filter(t=>t[0]!=='tool'||c.tool).map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join('')}</div>
  <div id="tabBody"></div>
  <div class="navrow"><button id="pv" ${prev?'':'disabled'}>← मागील</button><button id="dn" class="donebtn ${ps.done[n]?'is':''}">${ps.done[n]?'✓ पूर्ण झाले':'पूर्ण झाले'}</button><button id="nx" ${next?'':'disabled'}>पुढील →</button></div></div>`);
  const body=$('tabBody');
  const openTab=t=>{app.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
    const P2=getProg();P2.last={std,n,tab:t};setProg(P2);
    if(t==='notes') out(body,c.notes());
    else if(t==='ex') out(body,`<div class="card"><h2>सोडवलेली उदाहरणे</h2><p style="color:var(--muted);font-size:15px">प्रत्येक पायरी नीट वाचा, मग स्वतः वहीत सोडवून पाहा.</p>${c.ex()}</div>`);
    else if(t==='tool'){out(body,c.tool.map(k=>`<div class="card">${TOOLS[k].html()}</div>`).join('')); c.tool.forEach(k=>TOOLS[k].init());}
    else {out(body,'<div id="qbox"></div>'); runQuiz($('qbox'),c.q,(s,t2)=>{const P3=getProg(),p3=pstd(P3);p3.best[n]=Math.max(p3.best[n]||0,s);if(s/t2>=0.6)p3.done[n]=true;setProg(P3);const d=$('dn');if(d&&p3.done[n]){d.classList.add('is');out(d,'✓ पूर्ण झाले');}});}
    try{history.replaceState({screen:'ch',n,tab:t},'')}catch(e){} current={screen:'ch',n,tab:t};
  };
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{openTab(b.dataset.t); const tb=app.querySelector('.tabs'); if(tb&&tb.getBoundingClientRect().top<0) window.scrollTo(0,app.offsetTop);});
  openTab(tab==='tool'&&!c.tool?'notes':tab);
  $('pv').onclick=()=>prev&&go({screen:'ch',n:prev.n,tab:'notes'});
  $('nx').onclick=()=>next&&go({screen:'ch',n:next.n,tab:'notes'});
  $('dn').onclick=()=>{const P4=getProg(),p4=pstd(P4);if(p4.done[n]) delete p4.done[n]; else p4.done[n]=true;setProg(P4);const d=$('dn');d.classList.toggle('is',!!p4.done[n]);out(d,p4.done[n]?'✓ पूर्ण झाले':'पूर्ण झाले');};
}

function renderMix(){
  setBar('मिश्र चाचणी',stdWord());
  const all=[];chapters().forEach(c=>c.q.forEach(q=>all.push({...q,q:`<small style="color:var(--muted);font-weight:500">पाठ ${c.n} · ${escH(c.t)}</small><br>${q.q}`})));
  out(app,`<div class="page"><div class="card"><h2>📝 मिश्र चाचणी</h2><p>सर्व पाठांमधून निवडलेले 15 प्रश्न. प्रत्येक वेळी नवीन प्रश्न येतात.</p></div><div id="qbox"></div></div>`);
  runQuiz($('qbox'),shuffle(all).slice(0,15));
}

function render(){
  if(!std&&current.screen!=='home') current={screen:'home'};
  if(current.screen==='home') renderHome(); else if(current.screen==='list') renderList();
  else if(current.screen==='mix') renderMix(); else renderChapter(current.n,current.tab||'notes');
  $('digitBtn').textContent=useMr?'१२३':'123';
}
function go(state,replace){ current=state; try{replace?history.replaceState(state,''):history.pushState(state,'')}catch(e){} render(); window.scrollTo(0,0); }
window.addEventListener('popstate',e=>{ current=e.state||{screen:'home'}; render(); });
$('backBtn').onclick=()=>{ if(history.state&&history.state.screen!=='home') history.back(); else go({screen:'home'}); };
$('digitBtn').onclick=()=>{ useMr=!useMr; try{localStorage.setItem('nkm-digits',useMr?'mr':'en')}catch(e){} render(); };
try{history.replaceState({screen:'home'},'')}catch(e){}
render();
if(window.NK) NK.onReady(p=>{ if(!std&&p&&(p.cls==='6'||p.cls==='7')){ std=+p.cls; try{localStorage.setItem('nkm-std',std)}catch(e){} } render(); });
</script>
</body>
</html>
